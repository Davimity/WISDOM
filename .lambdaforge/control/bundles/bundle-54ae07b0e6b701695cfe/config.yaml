name: wisdom-preprocess
output_root: ../runs/tasks
inputs:
- name: protein_identifiers
  path: inputs/0-proteins.txt
- name: local_structure_fixtures
  path: inputs/1-data
required_artifacts:
- processed
- preprocessing-report.json
- preprocessing-manifest.json
- dataset-artifact.json
task:
  target: lambdaforge.preprocessing.PreprocessingTask
  params:
    source:
      target: preprocess.ProteinSource.ProteinSource
      params:
        input_name: protein_identifiers
    transforms:
    - target: preprocess.PreprocessPipeline.PreprocessPipeline
      params:
        identifier_input: protein_identifiers
        download_output: downloads
        download: true
        config:
          target: preprocess.PreprocessConfig.PreprocessConfig
          params:
            model_index: 0
            chains: []
            include_hydrogens: false
            include_waters: false
            include_nonpolymer: false
            include_metals: false
            center_coordinates: true
            atom_radius: 6.0
            surface_resolution: 1.0
            probe_radius: 1.4
            atom_surface_radius: 6.0
            curvature_scales:
            - 2.5
            - 5.0
    sink:
      target: preprocess.ProteinSink.ProteinSink
      params:
        identifier_input: protein_identifiers
        dataset_output: processed
        report_output: report
    workers: 4
    workload: cpu
    on_error: skip
    checkpoint_interval: 1
    dataset_name: wisdom-structural-proteins
    dataset_version: '2.1'
    dataset_metadata:
      format: wisdom-npz
      preprocessing_schema: '2.1'
extensions:
  wisdom_code_version: 0.5.0
  authoring:
    outputs:
      downloads: raw
      processed: processed
      report: preprocessing-report.json
    resources:
      cpus: 16
      memory: 120GiB
      time: 12h
    code_version: 0.5.0
metadata:
  phase: structural-preprocessing
kind: task
schema_version: '1.0'

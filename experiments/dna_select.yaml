# Discover a balanced, leakage-free protein roster; this action does not build surface arrays.
name: wisdom-dna-select                         # Stable LambdaForge Work name.
run: wisdom.preprocessing.Selection.select_dna # One complete public selection action.
output_root: ../runs/tasks                      # Keep task evidence outside experiments/.

with:                                           # Arguments passed directly to select_dna(...).
  public_sources:                               # LambdaForge fingerprints and stages this input.
    file: ../data/dna/public-sources.json       # Pinned DyProL, BTD-Combo, and BioLiP releases.
  dilutions: [0.10, 0.25, 0.50, 0.75]          # Nested train sizes with fixed val/test.
  workers: 72                                   # I/O threads; two per reserved CPU hide latency.
  requests_per_second: 4.0                      # Shared public-service request-start ceiling.
  retries: 5                                    # HTTP attempts with exponential backoff.
  max_positive_candidates: 0                    # Zero means use every positive candidate.
  max_negative_candidates: 0                    # Zero means use every negative candidate.
  contact_distance: 4.5                         # Protein–DNA heavy-atom cutoff in ångströms.
  minimum_residues: 30                          # Shortest accepted protein chain.
  minimum_interface_residues: 2                 # Contacting residues required for positives.
  minimum_sequence_coverage: 0.80               # Required observed/source sequence ratio.
  maximum_resolution: 4.0                       # Worst accepted resolution in ångströms.
  challenge_aspect_ratio: 4.0                   # Elongation threshold for the challenge tier.
  validation_fraction: 0.20                     # Development clusters assigned to validation.
  reserve_fraction: 0.10                        # Positive clusters held as local-GT reserves.
  selection_seed: 2026                          # Deterministic split/balance/dilution seed.

# select_dna option reference:
# public_sources has no default. dilutions=(0.10,0.25,0.50,0.75), workers=72,
# requests_per_second=4.0, retries=5, candidate limits=0, contact_distance=4.5,
# minimum_residues=30, minimum_interface_residues=2, minimum_sequence_coverage=0.80,
# maximum_resolution=4.0, challenge_aspect_ratio=4.0, validation_fraction=0.20,
# reserve_fraction=0.10, and selection_seed=2026. Fractions lie in (0,1), limits are
# non-negative, workers/retries/residue counts are positive, and distances are ångströms.

resources:                                      # One coordinator allocation for this Work.
  cpu: 36                                       # CPUs reserved by LambdaForge/scheduler.
  memory: 64GiB                                 # Peak host-memory reservation.
  time: 24h                                     # Scheduler wall-time limit.

# output_root defaults to runs/tasks relative to this YAML; WISDOM selects ../runs/tasks.
# LambdaForge 0.11 resource options are cpu>=1, gpu>=0, memory=<size>, and time=<duration>.
# They reserve capacity; scientific concurrency is the independent workers argument above.

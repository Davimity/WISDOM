# OBJECTIVE: compare one learned scalar per family against its archived V5a fixed reference.
# PREREQUISITES: use the completed V5a export (2026-10-08), identical data and reviewed backbone.
# VARIES: pooling family only; each family has one frozen measure and one frozen scalar start.
# FIXED: backbone, four paired seeds, protein BCE, validation objective, sealed test.
# DECISION: compare paired G, S, B, W, scalar trajectories and costs; do not repeat fixed controls.
name: wisdom-v5b-learned-pooling  # Five learned configurations, four paired seeds each, no HPO search.
run: wisdom.Training.Training  # Existing model, training loop, and central analysis profile.

with:  # Exact reviewed V5 backbone; only the sweep below varies.
  dataset: {dataset: wisdom-dna-reduced@6}             # Immutable benchmark; validation and test are not diluted.
  model_version: 2                                     # Existing generation exposing pooling alternatives.
  subset: "full"                                       # Use the complete reduced training population.
  initialization_profile: "baseline"                   # Reviewed initialization, unchanged across families.
  optimization_profile: "baseline"                     # Reviewed optimization, unchanged across families.
  hidden_dim: 128                                      # Shared atom/surface latent width.
  embedding_dim: 32                                    # Element embedding width.
  residue_embedding_dim: 64                            # Residue embedding width.
  atomic_layers: 2                                     # Atomic propagation depth.
  projection_depth: 3                                  # Atom-to-surface MLP depth.
  surface_layers: 4                                    # DiffusionNet depth.
  atom_spatial_k: 8                                    # Active spatial atom neighbors.
  surface_atom_k: 16                                   # Nearest transfer atoms per point.
  diffusion_spectral_modes: 32                         # Retained surface spectral modes.
  surface_atom_radius: 4                               # Transfer cutoff in angstroms.
  dropout: 0.2                                         # Training dropout probability.
  learning_rate: 0.001                                 # AdamW learning rate.
  weight_decay: 0.0005                                 # AdamW decoupled decay.
  gate_lambda: 0.04                                    # Expected L0 semantic-gate penalty.
  weak_loss_profile: "baseline"                        # Protein BCE only; no local-GT training.
  architecture_spike: "baseline"                       # Do not change the backbone.
  pooling_area_mode: "point"                           # V5a-selected measure for AutoPool, GeM and MAX-MEAN; LSE overrides it below.
  head_type: "single"                                  # One surface-to-protein head.
  batch_size: 16                                       # Proteins per update.
  epochs: 500                                          # Epoch ceiling; validation patience may stop earlier.
  patience: 30                                         # Stop after 30 non-improving validation epochs.
  minimum_delta: 0.001                                 # Minimum validation-utility improvement.
  precision: "auto"                                    # Use supported mixed precision.
  surface_metrics: true                                # Evaluation-only local ground truth.
  surface_metrics_interval: 1                          # Record local metrics each validation epoch.
  visualization:                                    # Presentation only; generated once at this Run's best checkpoint.
    mode: none                                      # none disables all viewers; report embeds HTML without duplicate files.
    content: predictions                            # Probability, original logits and soft/hard GT only; full adds structural layers.
    maximum_points: 2000                            # Deterministic display-only sample; metrics retain every point.
    maximum_proteins: 4                             # Balanced proteins per evaluated split; zero displays all.
    report_budget_mib: 4.0                          # Maximum embedded document size, not evaluation coverage.
    # identifiers: [1ABC_A]                         # Optional exact evaluated IDs instead of automatic balanced sampling.

  # Visualization defaults: mode=none (none/report/viewer/full), content=predictions
  # (predictions/full), maximum_points=2000 (>0), maximum_proteins=12 (>=0),
  # report_budget_mib=4.0 in (0,16], identifiers=(), threshold=0.5 in [0,1],
  # embed_report=true. report writes embedded pages only; viewer adds HTML/PLY;
  # full additionally saves prediction NPZ. none overrides embed_report completely.
  # This is per completed Run, not per epoch or a post-Study best-seed callback.
  # LF has a 64 MiB combined report limit: keep mode=none for large sweeps/HPO.
  faithfulness_audit: true                             # Deletion/insertion controls; regional audits remain unavailable.
  evaluate_test: false                                 # Keep held-out test sealed.
  data_workers: 4                                      # Persistent NPZ-decoding workers per Run.

# Training defaults differ from this reviewed ledger; see Training.run and README section 5.3.
# Pooling defaults: type=max, area=legacy, attention width=32/variant=simple, topk=0.05,
# regional length=2.5 angstroms/mode=fixed/init=1.5, LSE beta=5/mode=fixed/init=5,
# AutoPool alpha=1/mode=fixed/init=1, GeM power=1/mode=fixed/init=4,
# MAX-MEAN weight=0.5/mode=fixed/init=0.5. Curriculum end=null, hold=0.30.
# Lengths/beta/powers are positive (regional zero is identity); fractions/weights are in
# (0,1] / [0,1], alpha is non-negative. Learned bounds are documented in README 5.3.
# An inactive child is absent from the Trial; its Python default is not an active factor.

seeds: [4, 7, 32, 54]  # Four paired repetitions for every finite candidate; no seed racing.

# Archived V5a references were selected by the report's common balance B, not best-seed W.
# LSE: area, fixed beta=0.25; regional: fixed length=16 angstroms; AutoPool: point, alpha=500;
# GeM: point, power=2; MAX-MEAN: point, weight=0.95. Keep their four original seeds/checkpoints.
# Compare all G/S/W components from the globally selected checkpoint, never mix objectives.
# Do not retrain these fixed references, add MAX/MEAN controls, or average a family's full V5a grid.
# This is a validation-stage, V5a-informed comparison, not an independent test or proof that HPO
# can always be removed. A single frozen initialization does not establish initialization robustness.
# Top-K has no differentiable fraction mode in the current API. Attention already learns its scorer,
# and multiscale regional already learned its five weights in V5a; none adds a new scalar test here.

sweep:  # Native finite comparison, not hyperparameter optimization or initialization search.
  space:  # Only pooling_type has more than one authored value.
    pooling_type:  # One configuration for each implemented learned-scalar family.
      values: [log_sum_exp, local_mean_max, autopool, gem, max_mean]  # Exactly five branches.
    pooling_area_mode:  # Keep the selected V5a measure; other reduction families use with.point.
      values: [area]  # LSE's selected fixed reference used represented-area weighting.
      when: {pooling_type: log_sum_exp}  # Never cross point/area as an additional factor.
    log_sum_exp_mode:  # Make beta an ordinary model parameter in the unchanged optimizer.
      values: [learned]  # Neither fixed beta nor a curriculum is re-executed.
      when: {pooling_type: log_sum_exp}  # No inactive mode on other families.
    log_sum_exp_beta_init:  # Start at the declared V5a fixed reference, then learn beta by backpropagation.
      values: [0.25]  # One initial value, not a fixed pooling temperature or HPO factor.
      when: {pooling_type: log_sum_exp}  # One starting value, not an initialization grid.
    log_sum_exp_beta_bounds:  # Allow all positive fixed V5a betas with room past both grid edges.
      values: [[0.005, 2560.0]]  # One log-coordinate domain; the scalar is free to move within it.
      when: {pooling_type: log_sum_exp}  # Bounds have no effect on other families.
    regional_scale_mode:  # Learn the existing bounded regional heat length.
      values: [learned]  # The fixed V5a spectrum, backbone and surface labels are unchanged.
      when: {pooling_type: local_mean_max}  # Regional pooling only.
    regional_diffusion_scale_init:  # Start at the declared fixed reference; learn the same heat-length operator.
      values: [16.0]  # Physical initialization in angstroms, not a fixed final radius.
      when: {pooling_type: local_mean_max}  # One paired learned-vs-fixed comparison.
    regional_diffusion_scale_bounds:  # Cover V5a's positive heat lengths, including 16 and 64 angstroms.
      values: [[0.05, 128.0]]  # One log-coordinate domain; exact zero remains a V5a identity control.
      when: {pooling_type: local_mean_max}  # Only this family's learned physical length.
    autopool_alpha_mode:  # Learn probability-space concentration with the existing bounded scalar.
      values: [learned]  # No fixed AutoPool values are trained again.
      when: {pooling_type: autopool}  # AutoPool only.
    autopool_alpha_init:  # Start at the declared fixed alpha with the identical point measure.
      values: [500.0]  # Learned concentration, not fixed alpha=500 throughout training.
      when: {pooling_type: autopool}  # One start; no extra measure or initialization search.
    autopool_alpha_bounds:  # Include the fixed reference and V5a's largest alpha without a 50 ceiling.
      values: [[0.0, 2000.0]]  # One linear-coordinate domain; large alpha can yield small true gradients.
      when: {pooling_type: autopool}  # Nonnegative concentration on point probabilities only.
    gem_power_mode:  # Learn GeM's probability-space exponent.
      values: [learned]  # Fixed GeM references remain archived in V5a.
      when: {pooling_type: gem}  # GeM only.
    gem_power_init:  # Use the selected V5a power within the existing strict domain.
      values: [2.0]  # Highest-B fixed GeM setting, point measure.
      when: {pooling_type: gem}  # One starting power.
    gem_power_bounds:  # Cover V5a's nontrivial powers, with space beyond its upper grid edge.
      values: [[1.0, 2048.0]]  # Log-coordinate domain; exact power=1 remains a fixed mean control.
      when: {pooling_type: gem}  # Only the generalized probability mean learns this exponent.
    max_mean_lambda_mode:  # Learn the convex MAX-MEAN coefficient.
      values: [learned]  # Do not rerun either endpoint or the fixed best mixture.
      when: {pooling_type: max_mean}  # MAX-MEAN only.
    max_mean_lambda_init:  # Use the selected V5a mixture strictly inside (0,1).
      values: [0.95]  # Highest-B fixed MAX-MEAN setting, point measure.
      when: {pooling_type: max_mean}  # One starting mixture.

# Native sweep.space accepts finite values and conditional when; it executes every combination.
# All child dimensions are singleton values. No search, ranges, reference cell or competitive pruning.
# Branch counts: LSE=1, regional=1, AutoPool=1, GeM=1, MAX-MEAN=1.
# Total: five configurations x seeds [4,7,32,54] = 20 required Runs, replacing the old 300-run grid.
# Selected learned domains: beta=(0.005,2560), length=(0.05,128) angstroms,
# alpha=(0,2000), power=(1,2048), mixture=(0,1); starts must be strictly interior.
# True constructor defaults remain beta=(0.25,200), length=(0.05,12), alpha=(0,50),
# power=(1,32), mixture=(0,1). The four *_bounds parameters configure learned modes only;
# exact bounds are saved in model_parameters so old checkpoints keep their original interpretation.
# Positive bounds are required for log-coordinate beta/length; alpha must remain nonnegative,
# power at least one. Maximum/minimum limits are fixed constraints, not another search factor.
# Starts now reproduce all five declared V5a references exactly, rather than interior proxies.
# These are warm-start scalar comparisons: the backbone still trains from the same paired seeds,
# not from V5a weights. They do not establish that learning from an arbitrary start replaces HPO.
# The fixed reference is selected by B; inspect G, S, AUROC, W, regret and costs separately.
# Log the learned scalar at each epoch and at the restored globally selected checkpoint.
# Report saturation, movement from the start and seed dispersion; an unchanged scalar is informative.

objective:  # Unchanged development utility, never held-out test performance.
  metric: val_wisdom_hpo_score  # Existing protein/surface/coupling utility.
  mode: max  # Larger utility is better.
  range: [0.0, 1.0]  # Known bounded scale.
  practical_margin: 0.015  # Smaller differences are practically negligible.

# Objective requires metric; mode defaults to max; range/practical_margin are optional.
# Keep the existing utility and 0.015 margin; analysis never changes selection/pruning.

resources:  # One enclosing allocation for this complete Study, not one per family.
  gpu: 3  # Match the two-GPU ctgpgpu12 target.
  cpu: 36  # Shared host decoding/orchestration budget.
  memory: 96GiB  # Shared host-memory ceiling.
  time: 168h  # Scheduler wall-time ceiling for the enclosing allocation.

# Resource defaults: cpu=1, gpu=0, processes=1; memory/gpu_memory/storage=0, time=null.
# Counts are non-negative (cpu/processes >= 1, processes <= cpu); time must be positive. GPU packing is native
# automatic planning; no runs_per_gpu, max_parallel, or hard-coded VRAM reservations.

execution:  # Explicit logical budget, independently of the scheduler's allocation ceiling.
  max_time: 168h  # Stop dispatching new Runs after seven days; coverage may be incomplete.

# Execution defaults: max_time/max_runs/max_parallel/runs_per_gpu=null, failure_retries=1.
# A time budget does not grant extra scheduler time or guarantee full sweep completion.
# Omit max_time for an unbounded logical budget; resources.time still limits the allocation.

analysis:  # Small native overrides of Training.analysis_profile for this entire Study.
  metrics:  # Priorities order research interest only; objectives remain unchanged.
    val_faithfulness_deletion_top_minus_random_10: {priority: 65}  # Equal-area deletion control.
    val_faithfulness_insertion_top_minus_random_10: {priority: 65}  # Equal-area insertion control.
    train_cuda_peak_gib: {priority: 35}  # Epoch memory, not the whole-Run maximum.

# Analysis defaults to {}; metrics merge with the class profile. Priority defaults to 0 in LF;
# the central WISDOM profile defines 55/55/15 for these three metrics. Families, optional
# questions, discovery, and curve/outcome semantics remain owned by the shared native profile.

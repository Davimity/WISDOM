# OBJECTIVE: compare global/local head relationships after choosing one weak-loss policy.
# PREREQUISITES: V6a and any justified V6b/V6c/V6d follow-up must have reviewed winners.
# VARIES: head_type only.
# FIXED: every selected initialization, optimizer, core, pooling, and weak-loss decision.
# DECISION: select the simplest head whose utility and surface faithfulness improve credibly.
run: wisdom.Training.Training                       # Shared Work; the filename supplies its study name.

with:                                               # Explicit carry-forward ledger.
  dataset: {dataset: wisdom-dna-reduced@6}          # Immutable reduced benchmark.
  model_version: 2                                  # Internal generation exposing head alternatives.
  subset: full                                      # Complete reduced training population.
  pooling_type: max                                 # REPLACE with the V5 winner.
  topk_fraction: 0.05                               # REPLACE if V5 selects top-k.
  attention_hidden_dim: 32                          # REPLACE if V5 selects attention.
  regional_diffusion_scale: 2.5                     # REPLACE if V5 selects local-mean-max.
  log_sum_exp_beta: 5.0                             # REPLACE if V5 selects LogSumExp.
  initialization_profile: baseline                  # REPLACE with the V2 winner.
  optimization_profile: baseline                    # REPLACE with the V3 winner.
  hidden_dim: 128                                   # REPLACE with the V4 winner.
  embedding_dim: 32                                 # REPLACE with the V4 winner.
  residue_embedding_dim: 32                         # REPLACE with the V4 winner.
  atomic_layers: 2                                  # REPLACE with the V4 winner.
  projection_depth: 1                               # REPLACE with the V4 winner.
  surface_layers: 2                                 # REPLACE with the V4 winner.
  atom_spatial_k: 16                                # REPLACE with the V4 winner.
  surface_atom_k: 16                                # REPLACE with the V4 winner.
  diffusion_spectral_modes: 128                     # REPLACE with the V4 winner.
  surface_atom_radius: 6.0                          # REPLACE with the V4 winner.
  dropout: 0.2                                      # REPLACE with the V4 winner.
  learning_rate: 0.0003                             # REPLACE with the V4 winner.
  weight_decay: 0.0001                              # REPLACE with the V4 winner.
  gate_lambda: 0.001                                # REPLACE with the V4 winner.
  weak_loss_profile: custom                         # Preserve explicit selected weak-loss coefficients.
  negative_surface_lambda: 0.3                      # REPLACE with the V6a or V6d winner.
  positive_existence_lambda: 0.0                    # REPLACE only if V6b selected this term.
  regional_positive_lambda: 0.0                     # REPLACE if V6b or V6d selected this term.
  regional_loss_length: 2.5                         # REPLACE with the selected regional scale.
  regional_ranking_lambda: 0.0                      # REPLACE only if V6b selected this term.
  regional_ranking_margin: 0.5                      # REPLACE with the selected ranking margin.
  cardinality_lambda: 0.0                           # REPLACE only if V6c selected cardinality.
  total_variation_lambda: 0.0                       # REPLACE only if V6c selected TV.
  dirichlet_lambda: 0.0                             # REPLACE if V6c or V6d selected Dirichlet.
  architecture_spike: baseline                      # Architecture remains one-pass and scalar.
  global_context_dim: 16                            # Context bottleneck for conditioned heads.
  detach_global_context: true                       # Prevent local loss gradients entering context.
  direct_head_weight: 1.0                          # Direct protein BCE coefficient.
  surface_head_weight: 1.0                         # Surface-derived protein BCE coefficient.
  batch_size: 16                                    # Proteins per optimizer update.
  epochs: 500                                       # Safety ceiling.
  patience: 30                                      # Global validation patience.
  minimum_delta: 0.001                              # Required score improvement.
  precision: auto                                   # Hardware-safe mixed precision.
  surface_metrics: true                             # Evaluation-only local metrics.
  surface_metrics_interval: 1                       # Required G/S/regret curves.
  surface_visualization: none                       # Avoid candidate galleries.
  faithfulness_audit: true                          # Audit hotspot dependence.
  evaluate_test: false                              # Keep test sealed.
  data_workers: 4                                   # Persistent NPZ workers.

sweep:                                              # Complete head comparison with paired evidence.
  space:                                            # Every head is a required sweep cell.
    head_type:                                      # Relationship between global and local predictions.
      values:                                       # Closed HeadType vocabulary.
        - single                                    # Protein score is pooled directly from local logits.
        - dual                                      # Independent direct and surface-derived protein heads.
        - global_context                            # Detached global context enters localization.
        - film                                      # Zero-start FiLM uses global context.
  reference: {head_type: single}                    # Compare alternatives with the faithful single head.

objective:                                          # Rank by joint validation evidence.
  metric: val_wisdom_hpo_score                      # Global/surface/coupling utility.
  mode: max                                         # Maximize the composite validation utility.
  range: [0.0, 1.0]                                 # Mathematical bounds of the composite utility.
  practical_margin: 0.015                           # Smaller paired differences are negligible.

resources:                                          # Shared allocation for the complete study.
  gpu: 3                                            # Three available accelerators.
  cpu: 36                                           # Shared host decoding capacity.
  memory: 96GiB                                     # Shared host-memory ceiling.
  time: 168h                                        # Seven-day ceiling.

# head_type defaults to single. The direct and surface head weights are non-negative and cannot
# both be zero for a multi-head candidate. Surface ground truth remains outside optimization.
# LambdaForge 0.15 evaluates every head and grows complete shared-replicate blocks without HPO
# pruning or seed racing. Omitted execution limits let ARI derive safe parallel packing.

# Design WISDOM-DNA from explicit immutable evidence records; this does not generate surface NPZs.
# Native packages come from pyproject.toml/environment.yml. Before a managed-cluster run, execute
# `lf clusters bootstrap <cluster> --project .`; DatasetDesign then preflights both executables
# before downloading or analysing any structure.
name: wisdom-dna-design                                  # Stable LambdaForge Work identity.
run: wisdom.preprocessing.DatasetDesign.DatasetDesign    # Single Work owning the complete design phase.

with:                                                    # Arguments passed directly to DatasetDesign.run(...).
  raw_records: {file: ../data/dna/raw/raw.jsonl}         # One typed candidate/evidence object per UTF-8 line.
  workers: 64                                            # Concurrent PDB analyses and threads for each specialist tool.
  requests_per_second: 60.0                              # Allow sixty aggregate RCSB request starts per second.
  retries: 5                                             # Retry a failed RCSB transfer five times after its first attempt.
  output_directory: data/dna/design                      # Publish a verified convenient copy below the project root.
  overwrite_output: true                                 # Replace that copy atomically only after a successful Work.
  balance_classes: true                                  # Select a ratio-controlled canonical population.
  positive_negative_ratio: 1.0                           # Request one selected positive per selected negative.
  keep_all_negatives: true                               # Keep all curated negatives and reduce the positive majority.
  retain_core_positives: true                            # Prioritize BTD-Core positives when capacity permits.
  sequence_identity: 0.30                                # MMseqs2 hard-edge aligned identity threshold.
  sequence_coverage: 0.80                                # Minimum coverage required independently in both directions.
  sequence_evalue: 0.001                                 # Largest retained MMseqs2 expectation value.
  foldseek_probability: 0.90                             # Minimum Foldseek near-homology probability.
  foldseek_tmscore: 0.75                                 # Minimum of query- and target-normalized TM-score.
  foldseek_coverage: 0.80                                # Minimum Foldseek coverage for both structures.
  foldseek_evalue: 0.001                                 # Largest retained Foldseek expectation value.
  group_same_pdb: true                                   # Keep all examples from one PDB deposition in one group.
  giant_group_fraction_warning: 0.05                     # Warn when one component contains at least 5% of raw members.
  global_min_cluster_size: 15                            # Empirically stable minimum global phenotype support.
  global_min_samples: 2                                  # Preserve sparse global families without forced labels.
  interface_min_cluster_size: 20                         # Smallest stable positive-interface phenotype.
  interface_min_samples: 5                               # Interface HDBSCAN core-neighbour conservativeness.
  phenotype_stability_minimum: 0.60                      # Minimum median local-grid ARI before accepting clusters.
  phenotype_noise_warning: 0.50                          # Warn when half the selected set remains global noise.
  interface_region_distance: 8.0                         # Residue-centroid cutoff in Å for interface regions.
  maximum_resolution: 4.0                                # Canonical X-ray/cryo-EM resolution ceiling in Å.
  train_fraction: 0.70                                   # Target canonical fraction assigned to training.
  validation_fraction: 0.15                              # Target canonical fraction assigned to development.
  test_fraction: 0.15                                    # Target canonical fraction held for final evaluation.
  split_size_weight: 1.0                                 # Split objective weight for total population size.
  split_class_weight: 2.0                                # Split objective weight for label balance.
  split_global_phenotype_weight: 0.5                     # Split objective weight for global physical phenotypes.
  split_interface_phenotype_weight: 0.5                  # Weight for positive-interface physical phenotypes.
  split_source_weight: 0.25                              # Split objective weight for positive provenance origin.
  split_nuisance_weight: 0.25                            # Split objective weight for technical covariate means.
  split_refinement_steps: 500                            # Maximum deterministic group moves after greedy assignment.
  split_tolerance: 0.05                                  # Relative split-size deviation that triggers a warning.
  dilution_fractions: [1.0, 0.75, 0.50, 0.25, 0.10]      # Nested group-wise fractions of the fixed training split.
  dilution_replicates: 1                                 # Independent deterministic nested group rankings.
  smd_warning: 0.25                                      # Absolute standardized mean difference warning threshold.
  smd_strong_warning: 0.50                               # Absolute SMD classified as a strong warning.
  ks_warning: 0.20                                       # Kolmogorov–Smirnov statistic warning threshold.
  cramers_v_warning: 0.20                                # Categorical association warning threshold.
  technical_shortcut_auc_warning: 0.75                   # Group-CV technical-only AUROC red flag.
  seed: 2026                                             # Seed folded into every deterministic SHA-256 ranking.
  mmseqs_executable: mmseqs                              # MMseqs2 binary available in the Work environment.
  foldseek_executable: foldseek                          # Foldseek binary available in the Work environment.

# DatasetDesign.run option reference:
# Every public parameter is selected above and its true constructor default equals the shown value.
# raw_records has no default and accepts canonical .jsonl or legacy two-line .fasta/.fa/.faa input;
# JSONL is preferred because label evidence, assembly identity, provenance, and sequence are typed.
# output_directory=null keeps results only in LambdaForge; overwrite_output=false refuses a
# different existing copy. Relative output paths use the project root locally. On a cluster, use an
# absolute persistent path when the copy must outlive Job cleanup. maximum_resolution=4.0 Å by
# default; null disables canonical resolution filtering while preserving full-raw leakage evidence.
# phenotype_noise_warning=0.50 by default; it is a reporting-only fraction in [0,1].
# retries=5 means at most six transfer attempts because LambdaForge counts retries after the first.
# WISDOM passes researcher-owned scientific settings directly to their algorithms instead of
# maintaining a second validation layer. Use positive worker/count/rate values; unit fractions
# for identity, coverage, probability, TM-score, stability, and tolerance; positive E-values; split
# fractions summing to one; non-negative objective weights; and dilutions in (0,1] including 1.0.
# Invalid values fail naturally in LambdaForge, MMseqs2, Foldseek, clustering, or split construction.
# Executable values accept a binary name or path; LambdaForge records their resolved paths, versions,
# commands, bounded logs, and thread environments in Work provenance. WISDOM resolves and probes
# both programs before the first structure transfer, while pyproject.toml declares the bare names
# that managed bootstrap must install and verify.

resources:                                               # Portable reservation for this design Work.
  cpu: 36                                                # Reserve 36 CPUs while 64 I/O-heavy retrieval jobs overlap waits.
  memory: 96GiB                                          # Descriptor matrices, assemblies, and clustering headroom.
  storage: 100GiB                                        # Cached mmCIFs plus MMseqs2/Foldseek temporary databases.
  time: 24h                                              # Scheduler wall-time ceiling.

# LambdaForge 0.12 resource options are cpu>=1, gpu>=0, memory/gpu_memory/storage=<size>,
# time=<duration>, and processes<=cpu. This CPU-only Work leaves gpu and processes at framework
# defaults. Work run/cache/checkpoint directories remain LambdaForge-owned and are not YAML fields.

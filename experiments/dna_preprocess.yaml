# Build the complete WISDOM-DNA dataset from one frozen protein selection.
name: wisdom-dna-preprocess                         # Stable LambdaForge Work name.
run: wisdom.preprocessing.Preprocessing.preprocess_dna  # Complete dataset action.
output_root: ../runs/tasks                          # Store evidence outside experiments/.

with:                                               # Arguments for preprocess_dna(...).
  selection:                                        # Artifact fetched from dna_select.yaml.
    file: ../data/dna/selection                     # Complete frozen selection directory.
  workers: 36                                       # CPU processes used by both record pipelines.

# preprocess_dna option reference:
# selection has no default and must point to the complete fetched selection directory.
# dataset_name="wisdom-dna" and dataset_version="2" identify the immutable published dataset.
# workers=36 must be positive and normally matches the reserved CPU count.
# surface_resolution=1.0, probe_radius=1.4, atom_radius=6.0, and
# atom_surface_radius=6.0 are positive distances in ångströms.
# curvature_scales=(2.5,5.0) must be a strictly increasing sequence of positive ångström radii.
# positive_gap=1.4, negative_gap=3.0, and sensitivity_gaps=(1.0,1.4,2.0) are DNA-to-surface
# distances in ångströms; negative_gap must exceed positive_gap and the sequence cannot be empty.
# Add any of those names below `with` only when overriding its displayed constructor default.

resources:                                          # One allocation for the complete callable Work.
  cpu: 36                                           # CPUs reserved by LambdaForge or the scheduler.
  memory: 128GiB                                    # Peak host-memory reservation.
  time: 24h                                         # Scheduler wall-time limit.

# output_root defaults to runs/tasks relative to this YAML; WISDOM selects ../runs/tasks.
# LambdaForge 0.11 resource options are cpu>=1, gpu>=0, memory=<size>, and time=<duration>.
# Resource requests reserve capacity; `workers` independently controls record concurrency.

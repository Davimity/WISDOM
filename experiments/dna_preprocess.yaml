# Geometrically preprocess one already completed WISDOM-DNA design and publish its immutable data.
# Run experiments/dna_design.yaml first whenever data/dna/design does not yet exist. This Work does
# not execute DatasetDesign, MMseqs2, Foldseek, balancing, clustering, or split construction again.
name: wisdom-dna-preprocess                           # Stable LambdaForge Work identity.
run: wisdom.preprocessing.Preprocessing.Preprocessing # Geometry, annotation, validation, and publication only.

with:                                                # Arguments passed directly to Preprocessing.run(...).
  design: {file: ../data/dna/design}                 # Existing portable design directory produced by dna_design.yaml.
  dataset_name: wisdom-dna                            # Stable LambdaForge Registry family.
  dataset_version: "4"                               # Immutable release; bump for intended content changes.
  workers: 36                                        # One independent protein process per reserved CPU.
  requests_per_second: 60.0                           # Aggregate RCSB request-start ceiling across threads.
  retries: 5                                         # Retry each missing structure five times after failure.
  progress_log_seconds: 120.0                        # Emit one liveness log every two minutes during parallel phases.
  surface_resolution: 1.0                            # Target surface point spacing in Å.
  probe_radius: 1.4                                  # Solvent probe radius in Å.
  atom_radius: 6.0                                   # Sparse atom-edge cutoff in Å.
  atom_surface_radius: 6.0                           # Sparse atom-to-surface edge cutoff in Å.
  curvature_scales: [1.0, 2.0, 3.0, 5.0, 10.0]                       # Curvature fit radii in resolution units.
  positive_gap: 1.4                                  # Largest confidently DNA-contacting gap in Å.
  negative_gap: 3.0                                  # Smallest confidently non-contacting gap in Å.
  sensitivity_gaps: [1.0, 1.4, 2.0]                  # Evaluation-only positive cutoffs in Å.
resources:                                           # Geometry/annotation/publication reservation.
  cpu: 36                                            # Exact ceiling checked against workers.
  memory: 128GiB                                     # Concurrent protein surfaces and validation.
  storage: 150GiB                                    # Structures, NPZs, sidecars, and checkpoints.
  time: 24h                                          # Preprocessing wall-time ceiling.

# Preprocessing.run option reference:
# design has no default and must be a complete DatasetDesign directory. Its train-labelled.txt,
# validation-labelled.txt, and test-labelled.txt files use RCSB_CHAIN<TAB>0|1 and actively define
# split membership/labels; catalog.csv supplies assembly, copy, structure-hash, DNA-contact, group,
# phenotype, and provenance fields that cannot fit safely in a two-column TXT. Dilution manifests
# below dilutions/replicate-NN use the same labelled format and become dataset views; preprocessing
# always computes every canonical member once. dataset_name="wisdom-dna", dataset_version="4",
# workers=36, requests_per_second=4.0, retries=5, progress_log_seconds=120.0,
# surface_resolution=1.0 Å, probe_radius=1.4 Å, atom_radius=6.0 Å,
# atom_surface_radius=6.0 Å, curvature_scales=(2.5,5.0), positive_gap=1.4 Å,
# negative_gap=3.0 Å, and sensitivity_gaps=(1.0,1.4,2.0) are true defaults. workers is positive
# and <=resources.cpu; geometry radii/scales are positive (probe non-negative), gaps are
# non-negative, and negative_gap must exceed positive_gap. requests_per_second must be finite
# and positive; retries is a non-negative integer and counts attempts after the first request;
# progress_log_seconds must be finite and positive and changes log cadence, not scientific arrays.

# LambdaForge 0.12 resolves {file: ../data/dna/design} relative to this YAML, fingerprints the
# complete directory, and stages it on remote executions. The Work creates the Dataset entity in
# Python through self.outputs.dataset(...); no YAML dataset/stage/output schema is required.

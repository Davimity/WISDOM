# OBJECTIVE: isolate training randomness conditional on identical initial weights.
# PREREQUISITES: V1a must show scientifically relevant seed variance.
# VARIES: shuffle, dropout and gate samples; initial tensors stay fixed.
# FIXED: baseline architecture, initialization policy, optimizer, loss and immutable data.
# DECISION: compare all ten uncensored replications; this diagnostic selects no winner.
run: wisdom.Training.Training                   # Shared LambdaForge Work.
with:                                           # Fixed epoch-zero parameter seed.
  dataset: {dataset: wisdom-dna-reduced@6}      # Same immutable dataset as V1a.
  model_version: 1                              # Same internal capability generation.
  subset: full                                  # Same complete reduced train set.
  pooling_type: max                             # Same MAX aggregation.
  initialization_profile: baseline              # Same initialization policy.
  optimization_profile: baseline                # Same optimizer policy.
  weak_loss_profile: baseline                   # Same global BCE.
  architecture_spike: baseline                  # Same scalar one-pass model.
  initialization_seed: 2026                     # Identical parameter tensors in all Runs.
  training_seed: null                           # Each LambdaForge seed drives later randomness.
  save_initial_checkpoint: true                 # Preserve epoch-zero identity evidence.
  optimization_diagnostics: true                # Record collapse and gradient evidence.
  batch_size: 16                                # Proteins per update.
  epochs: 500                                   # Safety ceiling.
  patience: 30                                  # Global validation patience.
  precision: auto                               # Hardware-safe mixed precision.
  surface_metrics: true                         # Evaluation-only local diagnostics.
  surface_metrics_interval: 1                   # Coupling curve at every validation epoch.
  visualization:                                    # Presentation only; generated once at this Run's best checkpoint.
    mode: none                                      # none disables all viewers; report embeds HTML without duplicate files.
    content: predictions                            # Probability, original logits and soft/hard GT only; full adds structural layers.
    maximum_points: 2000                            # Deterministic display-only sample; metrics retain every point.
    maximum_proteins: 4                             # Balanced proteins per evaluated split; zero displays all.
    report_budget_mib: 4.0                          # Maximum embedded document size, not evaluation coverage.
    # identifiers: [1ABC_A]                         # Optional exact evaluated IDs instead of automatic balanced sampling.

  # Visualization defaults: mode=none (none/report/viewer/full), content=predictions
  # (predictions/full), maximum_points=2000 (>0), maximum_proteins=12 (>=0),
  # report_budget_mib=4.0 in (0,16], identifiers=(), threshold=0.5 in [0,1],
  # embed_report=true. report writes embedded pages only; viewer adds HTML/PLY;
  # full additionally saves prediction NPZ. none overrides embed_report completely.
  # This is per completed Run, not per epoch or a post-Study best-seed callback.
  # LF has a 64 MiB combined report limit: keep mode=none for large sweeps/HPO.
  evaluate_test: false                          # Keep test sealed.
  data_workers: 4                               # Persistent NPZ workers.
seeds:                                          # Complete uncensored training-RNG sample.
  - 4                                           # Training-randomness seed 1.
  - 7                                           # Training-randomness seed 2.
  - 32                                          # Training-randomness seed 3.
  - 54                                          # Training-randomness seed 4.
  - 65                                          # Training-randomness seed 5.
  - 94                                          # Training-randomness seed 6.
  - 109                                         # Training-randomness seed 7.
  - 124                                         # Training-randomness seed 8.
  - 142                                         # Training-randomness seed 9.
  - 167                                         # Training-randomness seed 10.
objective:                                      # Index all replications without pruning.
  metric: val_wisdom_hpo_score                  # Joint validation utility.
  mode: max                                     # Maximize the composite validation utility.
  range: [0.0, 1.0]                             # Mathematical bounds of the composite utility.
resources:                                      # Allocation for this independent Study.
  gpu: 2                                        # One accelerator per Run.
  cpu: 24                                     # Trainer plus data workers.
  memory: 20GiB                                 # Host decoding budget.
  time: 1680h                                   # Researcher-selected scheduler wall-time ceiling.

# Explicit seeds are mandatory. No search or sweep may censor this variance diagnostic.
# V1b and V1c answer complementary questions without composing Studies in steps.

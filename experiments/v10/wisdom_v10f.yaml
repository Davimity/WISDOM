# PREREQUISITES: Exact V10e @8 content and all seven structural chemical input sources.
# VARIES: Closed scalar profiles for S/C/O coefficients, initial activity, schedule and chemical controls.
# FIXED: Executed V10e SchNet RBF-16/64->128, MAX Heat6, weak R=.3, optimizer and G selection.
# DECISION: Compare learned selection and predictive S/G separately across paired seeds and costs.
# SOURCE: Executed V10e execution-fb5d3b83bc625f62; its fixed ledger matches the local V10e YAML.
# DESIGN: 20 complete profiles x 4 NEW paired seeds = 80 mandatory Runs; no HPO or test access.
# PRIMARY: Operational S at the checkpoint chosen ONLY by validation protein G.
name: wisdom-v10f  # New contemporary Study; never relabel or resume a historical execution.
run: wisdom.Training.Training  # One Work, with native LF finite sweep and result analysis.

with:  # Reviewed MAX R Single / Heat6 ledger; change upstream choices explicitly here.
  dataset: {dataset: wisdom-dna-reduced@8}  # Enriched publication must preserve reviewed members, splits, base geometry and GT.

# gate_policy=null preserves historical gate_lambda and global warm-up behavior.
# GatePolicy defaults: lambda_surface=lambda_chemical=lambda_other=0.04 (finite >=0);
# initial_active_surface=initial_active_chemical=initial_active_other=0.95 (strictly inside 0,1);
# warmup_fraction=ramp_fraction=0, each in [0,1] and sum<=1. t=(epoch-1)/epochs.
# Grouped costs are ALREADY weighted: sum_g lambda_g * sum_i P(path_i active)/41, no extra lambda.
# S=20 curvature gates, C=7 added source gates, O=21 historical gates; atom_context belongs to O.
# Fixed chemical gates have zero direct penalty. Compact has 43 gates, not equal full capacity.
# During S/C warm-up only those groups are forced open and unpenalized; O always stays learned.
# In ramp S/C become stochastic and their coefficients rise linearly; no horizon rescaling.
# Inference restores the selected checkpoint's exact overrides, including an unfinished warm-up.
# atomic_representation defaults: sources=[], identity_dim=8, force_sources=learned;
# force_sources accepts learned/open/closed; masks and values are gated together after projection.
# external_model=null, external_mode=none; context_dim=32 and standard_deviation_floor=1e-6.
# No changes to the seven source representations or additional preprocessing are introduced.
# Remaining fixed constructor defaults/reference are documented in the unchanged V10e ledger.


# OBJECTIVE: choose optimizer stabilization while retaining the initialization winner.
# PREREQUISITES: V2 must provide one reviewed initialization_profile winner.
# VARIES: optimization_profile only.
# FIXED: initialization winner, architecture, MAX pooling, global BCE, and data.
# DECISION: retain a policy only if four complete seeds improve utility/stability without slowdown.
name: wisdom-v3                                     # Short campaign name for optimizer screening.
run: wisdom.Training.Training                       # Shared LambdaForge training Work.

with:                                               # Carry-forward ledger for all earlier decisions.
  dataset: {dataset: wisdom-dna-reduced@6}          # Immutable reduced benchmark.
  model_version: 1                                  # Scalar DiffusionNet/MAX generation.
  subset: full                                      # Complete reduced train population.
  pooling_type: max                                 # Fixed baseline aggregation.
  initialization_profile: baseline                  # REPLACE with the reviewed V2 winner.
  weak_loss_profile: baseline                       # Global BCE only.
  architecture_spike: baseline                      # No architecture change.
  hidden_dim: 128                                   # Fixed pre-HPO latent width.
  embedding_dim: 32                                 # Fixed pre-HPO element width.
  residue_embedding_dim: 32                         # Fixed pre-HPO residue width.
  atomic_layers: 2                                  # Fixed pre-HPO atomic depth.
  projection_depth: 1                               # Fixed pre-HPO projection depth.
  surface_layers: 2                                 # Fixed pre-HPO DiffusionNet depth.
  optimization_diagnostics: true                    # Required stability and gradient evidence.
  batch_size: 16                                    # Proteins per optimizer step.
  epochs: 500                                       # Safety ceiling.
  patience: 30                                      # Global validation patience.
  minimum_delta: 0.001                              # Required score improvement.
  precision: auto                                   # Hardware-safe mixed precision.
  surface_metrics: true                             # Evaluation-only local metrics.
  surface_metrics_interval: 1                       # G/S/coupling every epoch.
  surface_visualization: none                       # Avoid candidate galleries.
  evaluate_test: false                              # Keep test sealed.
  data_workers: 4                                   # Persistent NPZ workers.

seeds:                                              # Four paired seeds completed for every profile.
  - 4                                               # Replication seed 1.
  - 7                                               # Replication seed 2.
  - 32                                              # Replication seed 3.
  - 54                                              # Replication seed 4.

search:                                             # Parallel finite optimizer sweep without censoring.
  strategy: adaptive                                # Retain concurrent child Runs, not adaptive elimination.
  trials: 8                                         # Enumerate every distinct optimizer profile.
  proposal_pool_size: 8                             # Exact categorical-space cardinality.
  runs_per_gpu: 3                                   # Three measured Runs per H100.
  max_parallel: 9                                   # Nine Runs over three H100s.
  min_seeds: 4                                      # Force all four seeds for every optimizer profile.
  confirmation_seeds: []                            # Do not add unequal winner-only replications.
  early_stopping:                                   # Disable probability-based curve pruning for this sweep.
    enabled: false                                  # Every Run reaches WISDOM's own stopping rule.
  optimization_profile:                            # One mutually exclusive optimizer change.
    values:                                         # Closed OptimizationProfile vocabulary.
      - baseline                                    # Plain AdamW control.
      - lr_warmup_05                                # Linear LR warm-up for first 5% of epochs.
      - lr_warmup_10                                # Linear LR warm-up for first 10% of epochs.
      - clip_1                                      # Clip global gradient norm at 1.
      - clip_5                                      # Clip global gradient norm at 5.
      - ema_099                                     # Evaluate exponential weight average with decay 0.99.
      - ema_0999                                    # Evaluate exponential weight average with decay 0.999.
      - swa                                         # Average late optimizer states with SWA.

objective:                                          # Rank optimizer policies by joint validation evidence.
  metric: val_wisdom_hpo_score                      # Joint global/surface utility.
  mode: max                                         # Larger is better.

resources:                                          # Complete adaptive-study allocation.
  gpu: 3                                            # Three available accelerators.
  gpu_memory: 20GiB                                 # Per-child admission threshold.
  cpu: 36                                           # Shared host decoding capacity.
  memory: 96GiB                                     # Shared host-memory ceiling.
  time: 168h                                        # Seven-day ceiling.

# optimization_profile defaults to custom. The chosen initialization remains independently active,
# so combinations such as gate_warmup + ema_0999 are now represented without precedence loss.
# min_seeds=4, early_stopping=false, and confirmation_seeds=[] make the comparison complete and
# paired while keeping LambdaForge's concurrent adaptive-study execution path.

# Compare only molecular-surface propagation while fixing atom encoding, transfer, and MAX pooling.
name: wisdom-v3                                      # Stable LambdaForge surface-ablation study name.
run: wisdom.Training.Training                       # Shared train/validate/test Work.

with:                                                # Fixed scientific and operational arguments.
  dataset:                                           # Resolve one immutable managed placement.
    dataset: wisdom-dna-reduced@6                    # Reduced schema-3 operators used by v1 and v2.
  model_version: 3                                  # Select the controlled surface-encoder generation.
  subset: full                                      # Use every train member already retained in this release.
  pooling_type: max                                 # Hold weak protein aggregation constant.

  hidden_dim: 128                                   # Fixed scalar atom/surface latent width.
  embedding_dim: 32                                 # Fixed element/residue embedding width.
  residue_embedding_dim: 32                         # Independent residue width, fixed to legacy value.
  atom_feature_preset: legacy                       # Preserve pre-expansion element/residue inputs.
  use_residue_type: true                            # Fixed reviewed atomic feature set.
  atomic_layers: 2                                  # Fixed relation-aware atomic depth.
  projection_depth: 1                              # Fixed atom/curvature fusion depth.
  surface_layers: 2                                 # Equal block depth for every surface backend.
  dropout: 0.2                                      # Equal regularization for every backend.
  atom_spatial_k: 16                                # Equal bounded atomic spatial topology.
  surface_atom_k: 16                                # Equal bounded atom-to-surface transfer.
  diffusion_spectral_modes: 128                     # Equal operator budget; used directly by controls.
  relation_mode: full_relational                    # Preserve spatial/covalent/both relation IDs.
  transfer_geometry: full                           # Preserve distance/normal/tangent transfer.
  surface_feature_mode: chemistry_geometry          # Preserve chemistry plus multiscale geometry.
  curvature_scale_count: 0                          # Use every persisted curvature scale.
  use_mean_curvature: true                          # Include mean curvature.
  use_gaussian_curvature: true                      # Include Gaussian curvature.
  use_curvedness: true                              # Include curvedness.
  use_shape_index: false                            # Preserve the former descriptor set.
  surface_atom_radius: 6.0                          # Transfer geometry normalization cutoff in Å.
  surface_chunk_size: 8192                          # Bounded atom-transfer activation chunk.
  atomic_message_chunk_size: 65536                  # Bounded LambdaForge RGCN message chunk.
  surface_patch_size: 64                            # Maximum compact PTv3 attention window.

  batch_size: 2                                     # Variable-size proteins per optimization step.
  epochs: 500                                       # Safety ceiling; validation patience stops plateaus.
  patience: 30                                      # Non-improving validation epochs before stopping.
  minimum_delta: 0.001                              # Required composite validation-utility improvement.
  precision: auto                                   # BF16 dense CUDA layers with FP32 sparse derivatives.
  surface_metrics: true                             # Evaluation-only localization diagnostics.
  surface_metrics_interval: 0                       # Evaluate surfaces only on the best checkpoint.
  evaluate_test: false                              # Keep test unopened during encoder comparison.
  data_workers: 4                                   # Overlap NPZ decoding with accelerator execution.

# Training.run option reference:
# model_version=1, subset="full", hidden_dim=128, embedding_dim=32, use_residue_type=true,
# atomic_layers=2, projection_depth=1, surface_layers=2, dropout=.2, atom_spatial_k=16,
# surface_atom_k=16, diffusion_spectral_modes=128, surface_atom_radius=6.0,
# surface_chunk_size=8192, atomic_message_chunk_size=65536, surface_encoder_type="diffusion",
# surface_patch_size=64, pooling_type="max", batch_size=2, epochs=100, patience=30,
# minimum_delta=.001, precision="auto", surface_metrics=true, surface_metrics_interval=0,
# evaluate_test=true, and
# data_workers=4 are true defaults.
# subset="full" selects every train member retained by this reduced release; validation/test are
# never filtered by a training view.
# v3 deliberately fixes all values except surface_encoder_type. Positive integer fields must remain
# positive; dropout is in [0,1); precision accepts auto/float32/bfloat16/float16. A zero surface
# interval evaluates only the restored best checkpoint; positive N also evaluates every N epochs.

seeds: [4, 7, 32, 54, 65, 94, 109, 124, 142, 167]    # Shared ordered seed budget for paired comparisons.

search:                                              # Adaptive one-factor surface comparison.
  strategy: adaptive                                # Race encoders using validation evidence.
  trials: 5                                         # Exactly five authored encoder candidates exist.
  runs_per_gpu: 4                                   # Allow four independent Runs per H100.
  max_parallel: 8                                   # Bound two H100s to eight concurrent Runs.
  min_seeds: 1                                      # Give every encoder at least one search seed.

  seed_racing:                                      # Allocate seeds while an encoder remains plausible.
    probability_threshold: 0.05                     # Continue above 5% practical-equivalence probability.
    equivalence_margin: 0.015                        # Treat utility differences <=0.015 as equivalent.

  early_stopping:                                   # Prune weak learning curves conservatively.
    enabled: true                                   # Enable cooperative Work stopping.
    min_step: 40                                    # Wait for forty validation epochs.
    confirmations: 3                                # Require three distinct confirmations.
    probability_threshold: 0.02                     # Stop below 2% competitive probability.
    equivalence_margin: 0.015                        # Preserve curves within 0.015 utility.

  surface_encoder_type:                             # Only trainable surface propagation varies.
    values: [diffusion, dmasif, deltaconv, ptv3, point_mamba] # Closed SurfaceEncoderType values.

# Search option reference:
# strategy defaults to adaptive when an objective exists. trials=5 covers the complete finite
# encoder set; adaptive seed racing changes replication effort, never the fixed backbone, transfer,
# pooling, or data. surface_encoder_type defaults to diffusion and accepts diffusion, dmasif,
# deltaconv, ptv3, or point_mamba. Search-policy values match v1.

objective:                                           # Same global composite utility as v1.
  metrics:                                          # All components are emitted at each validation epoch.
    val_auprc: {mode: max, weight: 0.35, range: [0.0, 1.0]} # Imbalance-aware ranking.
    val_auroc: {mode: max, weight: 0.20, range: [0.0, 1.0]} # Two-class ranking.
    val_balanced_accuracy: {mode: max, weight: 0.25, range: [0.0, 1.0]} # Thresholded balance.
    val_mcc_objective: {mode: max, weight: 0.20, range: [0.0, 1.0]} # Total MCC utility; zero penalizes one-class predictions.
  aggregation: geometric                            # Reward candidates strong across every component.

# Objective options:
# Composite components require mode, non-negative weight, and fixed finite range. Aggregation accepts
# weighted_mean, geometric, or chebyshev. Local surface metrics remain diagnostics and cannot rank
# these weakly supervised models.

resources:                                           # Fixed allocation for the complete study.
  gpu: 2                                             # Expose both H100s.
  gpu_memory: 20GiB                                  # Per-Run free-VRAM admission threshold.
  cpu: 36                                            # Total CPU shared by active Runs.
  memory: 96GiB                                      # Total host RAM shared by active Runs.
  time: 168h                                         # Seven-day ceiling for all backend/seed runs.

# LambdaForge resource options:
# LambdaForge adaptive defaults include fresh confirmation seeds, convergence detection, and one
# failure retry. cpu>=1, gpu>=0, memory/gpu_memory/storage=<size>, time=<duration>, and
# processes<=cpu. The framework owns run paths, seed racing, objective comparison, and indexing.

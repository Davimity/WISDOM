# Optional acquisition-only Work; the main workflow exposes the same discovery boundary.
run: wisdom.preprocessing.zinc.ZincDiscovery.ZincDiscovery  # Never publishes a DatasetVersion.
with:  # Public evidence and exact coordinates, no manual preparation required.
  skip: false  # True forwards existing_raw without acquisition.
  # existing_raw: {file: ../../../data/zinc/raw}  # Complete portable snapshot required when skipped.
  negative_evidence_go_terms: ["GO:0008270", "GO:0046872"]  # Experimental NOT Zn/metal binding, not absence.
  # negative_evidence: {file: ../../../data/zinc/negative-evidence.jsonl}  # Optional referenced exact-sequence override.
  workers: 8  # Concurrent native acquisition.
  maximum_entries: 0  # Zero means all query hits; a cap marks a pilot.
  acquire_functional_metadata: true  # Descriptive domains/taxonomy/EC, never labels or edges.
  output_directory: ../../../data/zinc/raw  # Successful native portable publication.
# Defaults: skip=false, existing_raw=null (required when skipped), negative_evidence=null,
# snapshot_label=null (optional human name), workers=8 (>0), maximum_entries=0 (>=0),
# requests_per_second=2 (>0 per-service ceiling), coordination_cutoff=3 Å (>0),
# minimum_occupancy=.5 ([0,1]), minimum_donors=2/minimum_residues=2 (>0 selected-copy counts).
# negative_evidence_go_terms=[GO:0008270,GO:0046872]; reviewed is-a ancestors
# GO:0043169/GO:0043167 allowed, never narrower functions or another metal.
# Canonical full-sequence mapping rejects mutations, tags, truncations, contexts and isoforms.
# acquire_functional_metadata=true; missing annotations stay missing. Snapshot identity hashes
# scientific policy and response/coordinate content; native checkpoints retain a resumable session.
# output_directory="../data/zinc/raw" (null managed only). No mapped negatives stops with an audit.
resources: {cpu: 8, memory: 16GiB}  # Host acquisition, no training.
# LF resource defaults: cpu=1 (>0), gpu=0 (>=0); memory/storage/time/processes optional.

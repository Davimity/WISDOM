# Observable evidence -> offline design -> geometry -> independent validation -> viewers.
name: wisdom-zinc-preprocess  # Only Preprocessing publishes a DatasetVersion.
steps:  # Sequential scientific boundaries visible in LambdaForge.
  - name: discover  # Freeze public evidence, responses and exact coordinates.
    run: wisdom.preprocessing.zinc.ZincDiscovery.ZincDiscovery  # Acquisition only, no splitting.
    with:  # A fresh Run requires no manually prepared input.
      skip: false  # True forwards existing_raw without network requests.
      # existing_raw: {file: ../../../data/zinc/raw}  # Complete snapshot required when skipped.
      negative_evidence_go_terms: ["GO:0008270", "GO:0046872"]  # Experimental NOT of Zn/metal binding; these terms are not negative themselves.
      # negative_evidence: {file: ../../../data/zinc/negative-evidence.jsonl}  # Optional referenced exact-sequence override.
      maximum_entries: 0  # Zero inspects every Zn entry; a positive cap marks a pilot.
      workers: 12  # Bounded acquisition concurrency, not scientific identity.
      acquire_functional_metadata: true  # Freeze domains, taxonomy and exact-sequence UniProt annotations.
      output_directory: ../../../data/zinc/raw  # Portable snapshot published only on success.
    # ZincDiscovery defaults: skip=false, existing_raw=null (required when skipped),
    # negative_evidence=null (automatic QuickGO NOT), snapshot_label=null (optional human label),
    # workers=8 (>0), maximum_entries=0 (>=0), requests_per_second=2 (>0 per-service ceiling),
    # coordination_cutoff=3 Å (>0), minimum_occupancy=.5 ([0,1]), minimum_donors=2,
    # minimum_residues=2 (>0 selected-copy counts), acquire_functional_metadata=true.
    # negative_evidence_go_terms=[GO:0008270,GO:0046872]; reviewed is-a ancestors
    # GO:0043169/GO:0043167 also allowed, never narrower functions or another metal.
    # output_directory="../data/zinc/raw"; null retains only managed outputs.
    # Native checkpoints retain one acquisition session across Attempts; content/policy determines
    # snapshot_id, never label/time/workers. No mapped negatives stops with an audit, no fallback.
    resources: {cpu: 12, memory: 16GiB}  # Network acquisition and assembly inspection, no GPU.
  - name: select  # Reverify frozen copies, group full RAW, characterize shapes and split once.
    run: wisdom.preprocessing.zinc.ZincSelection.ZincSelection  # Offline scientific design.
    with:  # No current RCSB revision is downloaded here.
      skip: false  # True forwards existing_design without scientific computation or tools.
      raw_path: {from: discover.raw}  # Adjacent provenance and structures are part of Discovery.
      # raw_path: {file: ../../../data/zinc/raw/raw.jsonl}  # Independent selection: remove discover and replace from.
      # existing_design: {file: ../../../data/zinc/design}  # With skip=true, remove discover and comment raw_path.
      workers: 12  # Local workers and specialist-tool threads.
      positive_policy: all  # Keep every eligible positive; evidence quality outranks balance.
      # positive_policy: diverse_quota  # Optional controlled-size selection, reporting coverage loss.
      # positive_negative_ratio: 1.0  # Applies only to diverse_quota, not a biological preference.
      sensitivity_cutoffs: [2.8, 3.0, 3.2]  # Audit-only Zn-donor Å cutoffs on fixed assemblies.
      sensitivity_minimum_donors: [2, 3, 4]  # Audit-only selected-copy donor atom minima.
      sensitivity_minimum_residues: [1, 2, 3]  # Audit-only distinct residue minima, no resplitting.
      evaluate_shortcuts: true  # Structural-only train/validation classifier; no acquisition fields.
      # functional_metadata: {file: ../../../data/zinc/functional-metadata.jsonl}  # Extra sequence-bound annotations.
      # site_metadata: {file: ../../../data/zinc/site-metadata.jsonl}  # Reviewed exact coordinate/site external support.
      output_directory: ../../../data/zinc/design  # Fixed decisions, sources, labelled TXT and reports.
    # ZincSelection defaults: skip=false, existing_design=null, raw_path=null (required unless skipped),
    # workers=8 (>0), coordination_cutoff=3 Å, minimum_occupancy=.5, minimum_donors=2,
    # minimum_residues=2, maximum_resolution=4 Å (null disables); no live service is consulted.
    # sequence_identity=.30, sequence_coverage=.80, sequence_evalue=1e-3;
    # foldseek_probability=.90, foldseek_tmscore=.75, foldseek_coverage=.80,
    # foldseek_evalue=1e-3; group_same_pdb=true. Similarity uses full RAW before selection.
    # Fractions/probabilities in [0,1], positive lengths/E-values and positive count minima.
    # phenotype_cluster_sizes=[5,10,15] (distinct >=2), phenotype_min_samples=2 (>0),
    # phenotype_stability=.7 (ARI minimum for >=2 non-noise clusters).
    # positive_policy="all" or "diverse_quota"; positive_negative_ratio=1 (>0, quota only).
    # sensitivity_cutoffs=[2.8,3,3.2] (>0 Å), sensitivity_minimum_donors=[2,3,4] and
    # sensitivity_minimum_residues=[1,2,3] (>0), Cartesian audit grid; never relabels/resplits.
    # surface_resolution=1 Å (>0), probe_radius=1.4 Å (>=0), positive_gap=1.4 Å (>=0).
    # Unsupported positive local sites force their whole leakage group to train.
    # functional_metadata=null: frozen identifier/sequence_sha256/source/version JSONL with
    # optional uniprot/pfam/interpro/cath/ec/family. site_metadata=null: frozen
    # identifier/site_id/structure_sha256/source/version/external_id plus optional family/reference.
    # Metadata never creates labels, edges or model inputs; unknown exact sites fail.
    # evaluate_shortcuts=true; train-only structural baseline, validation not test.
    # train_fraction=.70, validation_fraction=.15, test_fraction=.15 (positive, sum one),
    # dilution_fractions=[1,.75,.5,.25,.1] ((0,1], including 1), dilution_replicates=1 (>0),
    # seed=2026; output_directory="../data/zinc/design" (null disables external copy).
    resources: {cpu: 12, memory: 32GiB}  # Probe MMseqs2/Foldseek before expensive offline work.
  - name: preprocess  # Never rediscover, rebalance, recluster or repartition.
    run: wisdom.preprocessing.zinc.ZincPreprocessing.ZincPreprocessing  # Universal NPZ and Zn sidecars.
    with:  # TXT alone cannot restore assembly/site provenance.
      skip: false  # True publishes no dataset and performs no computation.
      design: {from: select.zinc-design}  # Exact selected coordinates and fixed partitions.
      # design: {file: ../../../data/zinc/design}  # Independent preprocessing: replace from and remove prior steps.
      dataset_name: wisdom-zinc  # Separate managed family; zinc_binding remains compatible.
      dataset_version: "2"  # Optional common structural assets; published @1 stays immutable.
      training_subset: full  # Or replicate-00/train-25; evaluation remains fixed.
      workers: 12  # Bounded geometry processes and annotation threads.
      atomic_context: true  # Protein-only identity, masked torsions and covalent context.
      source_quality: true  # Observed source quality metadata, not active neural inputs.
      extended_surface_atom: true  # CSR asset; do not replace the historic 6 Å/K32 base table.
      extended_radius: 12.0  # Protein atom-center cutoff in Å, independent of Zn targets.
      extended_k_max: 96  # Store up to 96 real candidates per point and audit all discarded ones.
    # ZincPreprocessing defaults: skip=false, design=null (required unless skipped),
    # dataset_name="wisdom-zinc", dataset_version="1", training_subset="full", workers=8 (>0),
    # surface_resolution=1, probe_radius=1.4, atom_spatial_radius=6, surface_atom_radius=6 Å;
    # atom_spatial_k_max=32, surface_atom_k_max=32, diffusion_spectral_modes_max=128,
    # surface_neighbor_k_max=24 (>0), curvature_scales=[2.5,5] (increasing positive).
    # positive_gap=1.4, negative_gap=3 Å (0<=positive<negative), sensitivity_gaps=[1,1.4,2];
    # progress_log_seconds=120 (>0), verbose=false. Zn never enters universal NPZ inputs.
    # Optional-family defaults: atomic_context=false, source_quality=true,
    # extended_surface_atom=false, extended_radius=12 Å (>0), extended_k_max=96 (>0 integer).
    # Empty/short CSR rows are legal; counts and discarded_count make truncation explicit.
    # These independently enabled families do not alter the base schema/configuration hash.
    resources: {cpu: 12, memory: 64GiB}  # Geometry dominates CPU/memory demand.
  - name: validate  # Independent audit after publication and before viewers.
    run: wisdom.preprocessing.zinc.ZincValidation.ZincValidation  # Scientific validation, not just hashes.
    with:  # Resolve publication only after preprocessing succeeds.
      dataset: {from: preprocess.dataset}  # Complete native placement.
      output_directory: ../../../data/zinc/validation  # Human verdict and ordered member errors.
    # ZincValidation defaults: dataset=null (required unless skipped), fail_on_error=true,
    # skip=false, output_directory=null. Failures register reports before raising.
    # For validation only, remove prior steps and bind {dataset: wisdom-zinc@1}.
    resources: {cpu: 1, memory: 8GiB}  # Sequential member audit, no model fitting.
  - name: visualize  # Runs after successful independent validation.
    run: wisdom.visualization.Visualization.Visualization  # Shared DNA/Zn HTML and PLY viewer.
    with:  # Scientific arrays are unchanged by display sampling.
      skip: false  # True creates no gallery; data and validation remain available.
      dataset: {from: preprocess.dataset}  # Native upstream DatasetVersion.
      output_directory: ../../../data/zinc/visualizations  # Offline gallery and full-point PLY.
      maximum_proteins: 12  # Deterministic display sample; zero means every member.
      splits: [train, validation, test]  # Display evidence, not checkpoint selection.
      labels: [0, 1]  # Explicit negatives and verified positives.
      report_section: true  # Register inspectors in the LF report.
    # Visualization defaults: skip=true, dataset=null (required unless skipped),
    # output_directory="../data/dna/visualizations", overwrite_output=true, identifiers=(),
    # splits=(train,validation,test), labels=(0,1), maximum_proteins=12 (>=0, zero all).
    # Identifiers override sample/maximum; maximum_surface_points=6000, maximum_mesh_points=2500,
    # maximum_edges=5000, normal_stride=25, normal_length=1.5 Å, mesh_alpha=4 Å,
    # maximum_vdw_atoms=1500 bound display only. report_section=true,
    # report_maximum_mib=4 ((0,16] MiB), verbose=false. GT metrics retain full point coverage.
    resources: {cpu: 1, memory: 8GiB}  # CPU rendering, no GPU.
# LF composition defaults: sequential authored dependencies; executable fields are
# run/with/resources/seeds/replicates/sweep/search/execution/objective/analysis as applicable.
# resources defaults cpu=1 (>0), gpu=0 (>=0); memory/storage/time/processes optional.
# Reuse RAW: discover.skip=true + existing_raw. Reuse design: remove discover, select.skip=true
# + existing_design, comment raw_path. Inspect an existing version: remove upstream blocks,
# replace validate/visualize dataset bindings with {dataset: wisdom-zinc@VERSION}.

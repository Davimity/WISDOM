# OBJECTIVE: test isolated architectural hypotheses only after all training-policy choices are fixed.
# PREREQUISITES: V7 must provide one reviewed head winner.
# VARIES: architecture_spike only, including an added-depth control for feedback.
# FIXED: every V2-V7 winner, loss, pooling, core hyperparameters, and data.
# DECISION: retain a spike only if it beats its relevant control across utility and faithfulness.
name: wisdom-v8                                     # Short campaign name for architecture spikes.
run: wisdom.Training.Training                       # Shared LambdaForge training Work.

with:                                               # Explicit carry-forward ledger.
  dataset: {dataset: wisdom-dna-reduced@6}          # Immutable reduced benchmark.
  model_version: 2                                  # Internal generation exposing controlled spikes.
  subset: full                                      # Complete reduced training population.
  pooling_type: max                                 # REPLACE with the V5 winner.
  topk_fraction: 0.05                               # REPLACE if V5 selects top-k.
  attention_hidden_dim: 32                          # REPLACE if V5 selects attention.
  regional_diffusion_scale: 2.5                     # REPLACE if V5 selects local-mean-max.
  log_sum_exp_beta: 5.0                             # REPLACE if V5 selects LogSumExp.
  initialization_profile: baseline                  # REPLACE with the V2 winner.
  optimization_profile: baseline                    # REPLACE with the V3 winner.
  hidden_dim: 128                                   # REPLACE with the V4 winner.
  embedding_dim: 32                                 # REPLACE with the V4 winner.
  residue_embedding_dim: 32                         # REPLACE with the V4 winner.
  atomic_layers: 2                                  # REPLACE with the V4 winner.
  projection_depth: 1                               # REPLACE with the V4 winner.
  surface_layers: 2                                 # REPLACE with the V4 winner.
  atom_spatial_k: 16                                # REPLACE with the V4 winner.
  surface_atom_k: 16                                # REPLACE with the V4 winner.
  diffusion_spectral_modes: 128                     # REPLACE with the V4 winner.
  surface_atom_radius: 6.0                          # REPLACE with the V4 winner.
  dropout: 0.2                                      # REPLACE with the V4 winner.
  learning_rate: 0.0003                             # REPLACE with the V4 winner.
  weight_decay: 0.0001                              # REPLACE with the V4 winner.
  gate_lambda: 0.001                                # REPLACE with the V4 winner.
  weak_loss_profile: custom                         # Preserve selected weak coefficients.
  negative_surface_lambda: 0.3                      # REPLACE with the V6a or V6d winner.
  positive_existence_lambda: 0.0                    # REPLACE if selected at V6b.
  regional_positive_lambda: 0.0                     # REPLACE if selected at V6b or V6d.
  regional_loss_length: 2.5                         # REPLACE with the selected regional scale.
  regional_ranking_lambda: 0.0                      # REPLACE if selected at V6b.
  regional_ranking_margin: 0.5                      # REPLACE with the selected ranking margin.
  cardinality_lambda: 0.0                           # REPLACE if selected at V6c.
  total_variation_lambda: 0.0                       # REPLACE if selected at V6c.
  dirichlet_lambda: 0.0                             # REPLACE if selected at V6c or V6d.
  head_type: single                                 # REPLACE with the V7 winner.
  global_context_dim: 16                            # REPLACE if V7 selects a conditioned head.
  detach_global_context: true                       # REPLACE with the V7 winner policy.
  direct_head_weight: 1.0                          # REPLACE with the V7 winner policy.
  surface_head_weight: 1.0                         # REPLACE with the V7 winner policy.
  batch_size: 16                                    # Proteins per optimizer update.
  epochs: 500                                       # Safety ceiling.
  patience: 30                                      # Global validation patience.
  minimum_delta: 0.001                              # Required score improvement.
  precision: auto                                   # Hardware-safe mixed precision.
  surface_metrics: true                             # Evaluation-only local metrics.
  surface_metrics_interval: 1                       # Required G/S/regret curves.
  surface_visualization: none                       # Avoid candidate galleries.
  faithfulness_audit: true                          # Required architecture-faithfulness evidence.
  evaluate_test: false                              # Keep test sealed.
  data_workers: 2                                   # Bound host load across packed Runs.

seeds:                                              # Five seeds for expensive structural changes.
  - 4                                               # Initial comparison seed.
  - 7                                               # Confirmation seed 2.
  - 32                                              # Confirmation seed 3.
  - 48                                              # Confirmation seed 4.
  - 92                                              # Confirmation seed 5.

search:                                             # Finite one-factor spike comparison.
  strategy: adaptive                                # Retain concurrent child Runs without elimination.
  trials: 6                                         # Enumerate every authored profile.
  proposal_pool_size: 6                             # Exact categorical-space cardinality.
  runs_per_gpu: 3                                   # Three measured Runs per H100.
  max_parallel: 9                                   # Nine Runs over three H100s.
  min_seeds: 5                                      # Force all five seeds for every architecture spike.
  confirmation_seeds: []                            # Do not add unequal winner-only seeds.
  early_stopping:                                   # Disable probability-based curve pruning.
    enabled: false                                  # Every Run reaches WISDOM's own stopping rule.
  architecture_spike:                              # Mutually exclusive architectural hypothesis.
    values:                                         # Closed ArchitectureSpike vocabulary.
      - baseline                                    # Scalar one-pass atom-to-surface control.
      - point_geometry                              # Condition transfer scoring on point geometry.
      - depth_control                               # Add depth without surface-to-atom feedback.
      - bidirectional                               # Add one surface-to-atom-to-surface refinement round.
      - vector_8                                    # Add eight equivariant atomic vector channels.
      - vector_16                                   # Add sixteen equivariant atomic vector channels.

objective:                                          # Rank by joint validation evidence.
  metric: val_wisdom_hpo_score                      # Global/surface/coupling utility.
  mode: max                                         # Larger is better.

resources:                                          # Complete adaptive-study allocation.
  gpu: 3                                            # Three available accelerators.
  gpu_memory: 20GiB                                 # Per-child admission threshold.
  cpu: 36                                           # Shared host capacity.
  memory: 96GiB                                     # Shared host-memory ceiling.
  time: 168h                                        # Seven-day ceiling.

# The bidirectional candidate must exceed depth_control, not merely baseline, before feedback can
# be credited. No spike combination is searched in this stage.
# min_seeds=5 equals the seeds list; early_stopping=false and confirmation_seeds=[] prevent
# candidate-dependent censoring while retaining concurrent child scheduling.

# OBJECTIVE: determine whether negative proteins provide useful weak surface supervision.
# PREREQUISITES: V5 must provide one reviewed pooling winner.
# VARIES: negative_surface_lambda in the prescribed baseline/0.1/0.3/1.0 screen.
# FIXED: every V2-V5 winner, all other weak-loss terms, architecture, and data.
# DECISION: continue to V6b only if negative supervision adds credible surface signal.
run: wisdom.Training.Training                       # Shared Work; the filename supplies its study name.

with:                                               # Explicit carry-forward ledger.
  dataset: {dataset: wisdom-dna-reduced@6}          # Immutable reduced benchmark.
  model_version: 2                                  # Pooling-capable internal generation.
  subset: full                                      # Complete reduced training population.
  pooling_type: max                                 # REPLACE with the V5 winner.
  topk_fraction: 0.05                               # REPLACE if V5 selects top-k.
  attention_hidden_dim: 32                          # REPLACE if V5 selects attention.
  regional_diffusion_scale: 2.5                     # REPLACE if V5 selects local-mean-max.
  log_sum_exp_beta: 5.0                             # REPLACE if V5 selects LogSumExp.
  initialization_profile: baseline                  # REPLACE with the V2 winner.
  optimization_profile: baseline                    # REPLACE with the V3 winner.
  hidden_dim: 128                                   # REPLACE with the V4 winner.
  embedding_dim: 32                                 # REPLACE with the V4 winner.
  residue_embedding_dim: 64                         # REPLACE with the V4 winner.
  atomic_layers: 2                                  # REPLACE with the V4 winner.
  projection_depth: 3                               # REPLACE with the V4 winner.
  surface_layers: 4                                 # REPLACE with the V4 winner.
  atom_spatial_k: 8                                 # REPLACE with the V4 winner.
  surface_atom_k: 16                                # REPLACE with the V4 winner.
  diffusion_spectral_modes: 32                      # REPLACE with the V4 winner.
  surface_atom_radius: 4.0                          # REPLACE with the V4 winner.
  dropout: 0.2                                      # REPLACE with the V4 winner.
  learning_rate: 0.001                              # REPLACE with the V4 winner.
  weight_decay: 0.0005                              # REPLACE with the V4 winner.
  gate_lambda: 0.04                                 # REPLACE with the V4 winner.
  weak_loss_profile: custom                         # Direct coefficients below remain authoritative.
  architecture_spike: baseline                      # No architecture change.
  head_type: single                                 # Fixed head relationship.
  batch_size: 16                                    # Proteins per optimizer update.
  epochs: 500                                       # Safety ceiling.
  patience: 30                                      # Global validation patience.
  minimum_delta: 0.001                              # Required score improvement.
  precision: auto                                   # Hardware-safe mixed precision.
  surface_metrics: true                             # Evaluation-only local metrics.
  surface_metrics_interval: 1                       # Required G/S/regret curves.
  surface_visualization: none                       # Avoid candidate galleries.
  faithfulness_audit: true                          # Diagnose hotspot dependence.
  evaluate_test: false                              # Keep test sealed.
  data_workers: 4                                   # Persistent NPZ workers.

sweep:                                              # Complete coefficient comparison with paired evidence.
  space:                                            # Every coefficient is a required sweep cell.
    negative_surface_lambda:                        # Area-weighted negative-bag local penalty.
      values:                                       # Prescribed non-factorial screen.
        - 0.0                                       # Global-BCE baseline with no local penalty.
        - 0.05                                      # Weak negative-surface constraint.
        - 0.1                                       # Weak negative-surface constraint.
        - 0.2                                       # Moderate negative-surface constraint.
        - 0.3                                       # Moderate negative-surface constraint.
        - 0.6                                       # Strong negative-surface constraint.
        - 0.8                                       # Strong negative-surface constraint.
        - 1.0                                       # Strong negative-surface constraint.
  reference: {negative_surface_lambda: 0.0}          # Compare every weight with global BCE alone.

objective:                                          # Rank by joint validation evidence.
  metric: val_wisdom_hpo_score                      # Global/surface/coupling utility.
  mode: max                                         # Maximize the composite validation utility.
  range: [0.0, 1.0]                                 # Mathematical bounds of the composite utility.
  practical_margin: 0.015                           # Smaller paired differences are negligible.

resources:                                          # Shared allocation for the complete study.
  gpu: 2                                            # Three available accelerators.
  cpu: 36                                           # Shared host decoding capacity.
  memory: 96GiB                                     # Shared host-memory ceiling.
  time: 168h                                        # Seven-day ceiling.

# All omitted weak coefficients default to zero. Surface ground truth remains evaluation-only and
# never enters the loss or checkpoint selector.
# LambdaForge 0.15 evaluates every coefficient, opens complete shared-replicate blocks, and applies
# no HPO pruning or seed racing. Omitted execution limits let ARI choose safe parallel packing.

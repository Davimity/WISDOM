# Keep the v1 backbone fixed and compare only WISDOM v2 protein-level pooling hypotheses.
name: wisdom-v2                                      # Stable LambdaForge experiment name.
run: wisdom.Training.train_wisdom                   # Same controlled training action as v1.
output_root: ../runs/experiments                    # Keep study evidence outside experiments/.

with:                                                # Fixed train_wisdom(...) arguments.
  dataset:                                           # Resolve one immutable managed placement.
    dataset: wisdom-dna@2                            # Exact release used by v1.
  model_version: 2                                  # Enable only the v2 pooling extension.
  subset: full                                      # Use the complete balanced dataset.
  hidden_dim: 128                                   # Fixed reviewed v1 latent width.
  embedding_dim: 32                                 # Fixed reviewed v1 embedding width.
  use_residue_type: true                            # Fixed reviewed v1 atom features.
  atomic_layers: 2                                  # Fixed reviewed v1 atomic depth.
  projection_depth: 1                              # Fixed reviewed v1 projection depth.
  surface_layers: 2                                 # Fixed reviewed v1 surface depth.
  dropout: 0.2                                      # Fixed reviewed v1 dropout.
  learning_rate: 0.0003                             # Fixed reviewed v1 AdamW rate.
  weight_decay: 0.0001                              # Fixed reviewed v1 AdamW decay.
  topk_fraction: 0.05                               # Retained fraction for top-k mean.
  attention_hidden_dim: 32                          # Attention scoring-network width.
  regional_levels: 1                                # Local smoothing rounds before regional MAX.
  log_sum_exp_beta: 5.0                             # Log-sum-exp inverse temperature.
  batch_size: 2                                     # Variable-size proteins per step.
  epochs: 100                                       # Maximum epochs per pooling/seed run.
  data_workers: 0                                   # Loader subprocesses inside each run.

# Fixed train_wisdom option reference:
# Values shown above equal public defaults except model_version=2. subset="full"; widths and
# depths are positive; dropout is in [0,1); topk_fraction is in (0,1]; attention_hidden_dim and
# regional_levels are positive; log_sum_exp_beta and learning_rate are positive; weight_decay and
# data_workers are non-negative; batch_size and epochs are positive.

seeds: [7, 17, 27]                                  # Repeat every pooling for seed uncertainty.
search:                                              # Exhaustive one-factor scientific ablation.
  pooling_type:                                     # Only this model property may vary in v2.
    values: [max, mean, attention, topk, local_mean_max, log_sum_exp] # Closed PoolingType set.

# pooling_type defaults to "max". The accepted values are MAX, arithmetic mean, learned sparse
# attention, top-k mean, local area-weighted mean followed by global MAX, and normalized
# log-sum-exp. With categorical values and no trials field, LambdaForge expands every alternative.

objective:                                           # Used to compare pooling hypotheses.
  metric: val_auprc                                  # Validation precision–recall area.
  mode: max                                          # Larger validation AUPRC is better.
max_parallel: 1                                      # Run one single-GPU training at a time.

resources:                                           # Per-training allocation.
  gpu: 1                                             # Exactly one accelerator per run.
  cpu: 4                                             # Data loading and orchestration.
  memory: 32GiB                                      # Host-memory reservation.
  time: 24h                                          # Scheduler wall-time limit.

# output_root defaults to runs/tasks per internal Work; WISDOM selects ../runs/experiments.
# LambdaForge study options: seeds defaults to one implicit seed; objective uses metric plus
# mode=max|min; max_parallel defaults to available placement. Resource options are gpu>=0,
# cpu>=1, memory=<size>, and time=<duration>.

# Keep the v1 backbone fixed and compare only WISDOM v2 protein-level pooling hypotheses.
name: wisdom-v2                                      # Stable LambdaForge experiment name.
run: wisdom.Training.Training                       # Same LambdaForge 0.14 Work class as v1.

with:                                                # Fixed Training.run(...) arguments.
  dataset:                                           # Resolve one immutable managed placement.
    dataset: wisdom-dna-reduced@6                    # Exact reduced schema-3 release used by v1.
  model_version: 2                                  # Enable only the v2 pooling extension.
  subset: full                                      # Use every train member already retained in this release.
  hidden_dim: 128                                   # Fixed reviewed v1 latent width.
  embedding_dim: 32                                 # Fixed reviewed v1 embedding width.
  residue_embedding_dim: 32                         # Independent residue width, fixed to legacy value.
  atom_feature_preset: legacy                       # Preserve pre-expansion element/residue inputs.
  use_residue_type: true                            # Fixed reviewed v1 atom features.
  atomic_layers: 2                                  # Fixed reviewed v1 atomic depth.
  projection_depth: 1                              # Fixed reviewed v1 projection depth.
  surface_layers: 2                                 # Fixed reviewed v1 surface depth.
  atom_spatial_k: 16                                # Fixed reviewed v1 atomic-neighbor budget.
  surface_atom_k: 16                                # Fixed reviewed v1 transfer-neighbor budget.
  diffusion_spectral_modes: 128                     # Fixed reviewed v1 intrinsic frequency budget.
  relation_mode: full_relational                    # Preserve spatial/covalent/both relation IDs.
  transfer_geometry: full                           # Preserve distance/normal/tangent transfer.
  surface_feature_mode: chemistry_geometry          # Preserve transferred chemistry plus geometry.
  curvature_scale_count: 0                          # Use every persisted curvature scale.
  use_mean_curvature: true                          # Include mean curvature.
  use_gaussian_curvature: true                      # Include Gaussian curvature.
  use_curvedness: true                              # Include curvedness.
  use_shape_index: false                            # Preserve the former descriptor set.
  surface_atom_radius: 6.0                          # Fixed transfer geometry normalization in Å.
  surface_chunk_size: 8192                          # Bound atom-transfer gathered activations.
  atomic_message_chunk_size: 65536                  # Bound LambdaForge RGCN edge activations.
  dropout: 0.2                                      # Fixed reviewed v1 dropout.
  learning_rate: 0.0003                             # Fixed reviewed v1 AdamW rate.
  weight_decay: 0.0001                              # Fixed reviewed v1 AdamW decay.
  topk_fraction: 0.05                               # Retained fraction for top-k mean.
  attention_hidden_dim: 32                          # Attention scoring-network width.
  regional_diffusion_scale: 2.5                     # Physical smoothing length in Å before MAX.
  log_sum_exp_beta: 5.0                             # Log-sum-exp inverse temperature.
  batch_size: 2                                     # Variable-size proteins per step.
  epochs: 100                                       # Maximum epochs per pooling/seed run.
  patience: 30                                      # Stop a plateau without changing model selection.
  minimum_delta: 0.001                              # Meaningful composite validation-utility improvement.
  precision: auto                                   # BF16 dense CUDA layers with FP32 sparse derivatives.
  surface_metrics: true                             # Compare local maps without supervising them.
  surface_metrics_interval: 0                       # Evaluate surfaces only on the best checkpoint.
  evaluate_test: false                              # Keep test unopened during pooling comparison.
  data_workers: 2                                   # Overlap NPZ decoding without consuming all four CPUs.

# Fixed Training.run option reference:
# Values shown above equal public defaults except model_version=2,
# residue_embedding_dim=32, evaluate_test=false, and data_workers=2.
# subset="full" selects every train member retained by this reduced release; validation/test are
# never filtered by a training view. Widths and depths/K/J/mode budgets are positive; dropout is in [0,1);
# topk_fraction is in (0,1];
# attention_hidden_dim and regional_diffusion_scale are positive; log_sum_exp_beta and learning_rate are positive; weight_decay and
# data_workers=4 by default; this 4-CPU experiment selects two so the trainer retains CPU capacity.
# data_workers and minimum_delta are non-negative; batch_size, epochs, and patience are positive;
# precision accepts "auto", "bfloat16", "float16", or "float32";
# surface_metrics=true and surface_metrics_interval=0 by default. False disables sidecar
# diagnostics; interval zero evaluates the restored best checkpoint only, while positive N also
# evaluates every N validation epochs.

seeds: [4, 7, 32, 54, 65, 94, 109, 124, 142, 167]    # Shared ordered seed budget for paired comparisons.
search:                                              # Adaptive one-factor pooling comparison.
  strategy: adaptive                                # Race poolings using validation evidence.
  trials: 6                                         # Exactly six authored pooling candidates exist.
  runs_per_gpu: 4                                   # Allow four independent Runs per H100.
  max_parallel: 8                                   # Bound two H100s to eight concurrent Runs.
  min_seeds: 1                                      # Give every pooling at least one search seed.

  seed_racing:                                      # Allocate seeds while a pooling remains plausible.
    probability_threshold: 0.05                     # Continue above 5% practical-equivalence probability.
    equivalence_margin: 0.015                        # Treat utility differences <=0.015 as equivalent.

  early_stopping:                                   # Prune weak learning curves conservatively.
    enabled: true                                   # Enable cooperative Work stopping.
    min_step: 40                                    # Wait for forty validation epochs.
    confirmations: 3                                # Require three distinct confirmations.
    probability_threshold: 0.02                     # Stop below 2% competitive probability.
    equivalence_margin: 0.015                        # Preserve curves within 0.015 utility.

  pooling_type:                                     # Only this model property may vary in v2.
    values: [max, mean, attention, topk, local_mean_max, log_sum_exp] # Closed PoolingType set.

# strategy defaults to adaptive when an objective exists. trials=6 covers the complete finite
# pooling set; adaptive seed racing changes replication effort, never the fixed backbone or data.
# pooling_type defaults to max and accepts MAX, arithmetic mean, learned sparse attention, top-k
# mean, fixed spectral diffusion/global MAX, and normalized log-sum-exp. Search-policy values match
# v1 so pooling comparisons use the same statistical decision thresholds.

objective:                                           # Same global composite utility as v1.
  metrics:                                          # All components are emitted at each validation epoch.
    val_auprc: {mode: max, weight: 0.35, range: [0.0, 1.0]} # Imbalance-aware ranking.
    val_auroc: {mode: max, weight: 0.20, range: [0.0, 1.0]} # Two-class ranking.
    val_balanced_accuracy: {mode: max, weight: 0.25, range: [0.0, 1.0]} # Thresholded balance.
    val_mcc_objective: {mode: max, weight: 0.20, range: [0.0, 1.0]} # Total MCC utility; zero penalizes one-class predictions.
  aggregation: geometric                            # Reward candidates strong across every component.

resources:                                           # Fixed outer allocation for the complete study.
  gpu: 2                                             # Expose both H100s.
  gpu_memory: 20GiB                                  # Per-Run free-VRAM admission threshold.
  cpu: 36                                            # Total CPU shared by active Runs.
  memory: 96GiB                                      # Total host RAM shared by active Runs.
  time: 168h                                         # Seven-day study ceiling.

# LambdaForge adaptive defaults include probabilistic racing, fresh confirmation seeds, convergence
# detection, and failure recovery. WISDOM overrides the thresholds shown above to match v1.
# Composite ranges are fixed and weights are normalized by LambdaForge. Resource options are cpu,
# gpu, memory, gpu_memory, time, storage, and processes; output paths remain framework-owned.

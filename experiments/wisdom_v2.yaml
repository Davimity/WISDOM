# V2: factor seed variance into parameter initialization and post-initialization stochasticity.
name: wisdom-v2-seed-diagnostics                     # Second campaign stage: isolate both RNG sources.

steps:                                               # Run both complementary controls independently.
  - name: fixed-initialization                       # Experiment A: same weights, varying training randomness.
    run: wisdom.Training.Training                    # Shared training Work.
    with:                                            # Fixed baseline and fixed epoch-zero parameter seed.
      dataset: {dataset: wisdom-dna-reduced@6}       # Immutable reduced benchmark.
      model_version: 1                               # Scalar DiffusionNet/MAX baseline.
      subset: full                                   # Complete reduced training population.
      pooling_type: max                              # Fixed faithful pooling.
      stability_profile: baseline                    # Historical parameter policy.
      weak_loss_profile: baseline                    # Global BCE only.
      architecture_spike: baseline                   # Scalar one-pass baseline.
      initialization_seed: 2026                      # Identical epoch-zero weights in every expanded run.
      training_seed: null                            # Null uses each LambdaForge seed for shuffle/dropout/gates.
      save_initial_checkpoint: true                  # Publish proof that epoch-zero states are identical.
      optimization_diagnostics: true                 # Record gradients, activations, logits, and gate saturation.
      batch_size: 16                                 # Proteins per update.
      epochs: 500                                    # Safety ceiling.
      patience: 30                                   # Global-only validation patience.
      precision: auto                                # Hardware-safe mixed precision.
      surface_metrics: true                          # Evaluation-only local metrics.
      surface_metrics_interval: 1                    # Track G/S/coupling over time.
      surface_visualization: none                    # Seed diagnosis needs metrics, not repeated galleries.
      evaluate_test: false                           # Keep test sealed.
      data_workers: 4                                # Persistent graph decoders.
    seeds: [4, 7, 32, 54, 65, 94, 109, 124, 142, 167] # Ten stochastic training replications.
    objective: {metric: val_wisdom_hpo_score, mode: max} # Index results without pruning them.
    resources: {gpu: 1, cpu: 8, memory: 24GiB, time: 168h} # Per-replication allocation.

    # initialization_seed/training_seed default to null and independently fall back to LambdaForge's
    # run seed. save_initial_checkpoint=false by default. This step fixes only initialization;
    # every declared seed must complete because there is no search section.

  - name: fixed-training-randomness                  # Experiment B: varying weights, same later randomness.
    run: wisdom.Training.Training                    # Shared training Work.
    with:                                            # Same baseline, now fixing stochastic training instead.
      dataset: {dataset: wisdom-dna-reduced@6}       # Exact dataset used by Experiment A.
      model_version: 1                               # Exact same architecture.
      subset: full                                   # Exact same training population.
      pooling_type: max                              # Exact same pooling.
      stability_profile: baseline                    # Exact same initialization policy, not seed.
      weak_loss_profile: baseline                    # Exact same loss.
      architecture_spike: baseline                   # Exact same architecture controls.
      initialization_seed: null                      # Null uses each LambdaForge seed for different weights.
      training_seed: 2026                            # Identical shuffle/dropout/gate RNG after construction.
      save_initial_checkpoint: true                  # Publish each distinct epoch-zero state.
      optimization_diagnostics: true                 # Same stability measurements as Experiment A.
      batch_size: 16                                 # Proteins per update.
      epochs: 500                                    # Safety ceiling.
      patience: 30                                   # Global-only validation patience.
      precision: auto                                # Hardware-safe mixed precision.
      surface_metrics: true                          # Evaluation-only local metrics.
      surface_metrics_interval: 1                    # Track G/S/coupling over time.
      surface_visualization: none                    # Avoid duplicate heavy viewer artifacts.
      evaluate_test: false                           # Keep test sealed.
      data_workers: 4                                # Persistent graph decoders.
    seeds: [4, 7, 32, 54, 65, 94, 109, 124, 142, 167] # Ten initialization replications.
    objective: {metric: val_wisdom_hpo_score, mode: max} # Index results without HPO selection.
    resources: {gpu: 1, cpu: 8, memory: 24GiB, time: 168h} # Per-replication allocation.

    # The fixed training seed resets torch RNG after model construction and local-head calibration.
    # DataLoader order, dropout, and Hard-Concrete samples therefore match as closely as deterministic
    # CUDA kernels allow. Compare variance with fixed-initialization to identify the dominant source.

# V2 varies initialization or training randomness through the seed lists; the architecture is fixed
# intentionally so variance can be attributed to one RNG source. Step fields accept run, with,
# seeds, objective, and resources. Both steps deliberately omit search:
# adaptive pruning would bias the ten-seed variance estimate and collapse-rate diagnosis.

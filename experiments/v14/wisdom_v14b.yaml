# OBJECTIVE: Feasibility-gated external atom representation with chemical sources held fixed.
# PREREQUISITES: run enrich_atomic.yaml with the reviewed SLAE runtime; verify real coverage first.
# VARIES: only explicitly enumerated scientific alternatives; no adaptive pruning.
# FIXED: protein-only epoch selection, validation-only localization, no test, common backbone.
# DECISION: prioritize paired operational S with viable G, original S, distributed negative evidence and cost; no retrospective non-inferiority claim.
# CONTINUATION: Rank-16 alone improves S/raw-S at modest memory and negative-evidence cost; do not stack unconfirmed V11/V13 candidates.
# WIDTH CONTINUATION: V14b onward uses aligned ESM-2 context 64 / SchNet state 128 from V14a; historical V14a/a2 remain unchanged.
name: wisdom-v14b  # Independent native LambdaForge Study; no training steps composition.
run: wisdom.Training.Training  # Single public PyTorch Work, native scheduling and reporting.

with:  # Frozen common backbone; all exposed scientific values remain configurable here.
  dataset: {"dataset":"wisdom-dna-reduced-slae@1"}  # Declared enriched @9; verify selected population, labels and asset coverage against @8 before training.
  model_version: 2  # Existing pooling-capable scalar model; no renamed architecture generation.
  subset: "full"  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_representation_mode: "learned"  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_encoder_type: "diffusion"  # Inherited common scientific setting; held fixed across the authored candidates.
  initialization_profile: "baseline"  # Inherited common scientific setting; held fixed across the authored candidates.
  embedding_initialization: "current"  # Inherited common scientific setting; held fixed across the authored candidates.
  optimization_profile: "baseline"  # Inherited common scientific setting; held fixed across the authored candidates.
  hidden_dim: 128  # Common atom output/surface width, not a residual-graph width.
  embedding_dim: 32  # Inherited common scientific setting; held fixed across the authored candidates.
  residue_embedding_dim: 64  # Inherited common scientific setting; held fixed across the authored candidates.
  atomic_layers: 2  # Two existing atom interactions unless an explicitly declared topology changes them.
  projection_depth: 3  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_layers: 4  # Inherited common scientific setting; held fixed across the authored candidates.
  atom_spatial_k: 8  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_atom_k: 16  # Inherited common scientific setting; held fixed across the authored candidates.
  diffusion_spectral_modes: 32  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_atom_radius: 4  # Inherited common scientific setting; held fixed across the authored candidates.
  transfer_options: {"message":"low_rank","rank":16}  # V11b continuation: one mean, one attention distribution, rank-16 receiver-conditioned correction.
  surface_options: {"use_gradient":true,"readout_mode":"single","readouts":1,"local_mode":"none","spectral_source":"base"}  # Keep the tested DiffusionNet path; no untested combination with gradient removal or local messages.
  atomic_edge_distance_scale: 6  # Inherited common scientific setting; held fixed across the authored candidates.
  dropout: 0.2  # Inherited common scientific setting; held fixed across the authored candidates.
  learning_rate: 0.001  # Inherited common scientific setting; held fixed across the authored candidates.
  weight_decay: 0.0005  # Inherited common scientific setting; held fixed across the authored candidates.
  gate_lambda: 0.04  # Inherited common scientific setting; held fixed across the authored candidates.
  gate_policy: {"lambda_surface":0.04,"lambda_chemical":0.04,"lambda_other":0.04,"initial_active_surface":0.95,"initial_active_chemical":0.95,"initial_active_other":0.95,"warmup_fraction":0,"ramp_fraction":0}  # Freeze validated grouped gate costs, initialization and schedule.
  atomic_representation: {"sources":["atom_name","residue_atom"],"identity_dim":8,"force_sources":"learned","external_model":"esm2","external_mode":"context","context_dim":64}  # Complete input policy; nested sweep mappings replace it rather than merge.
  pooling_type: "max"  # Provisional common MAX reference; local targets never enter epoch selection.
  pooling_area_mode: "point"  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_refiner_type: "heat"  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_refiner_heat_length: 6  # Physical Heat6 refinement length in angstroms.
  weak_loss_profile: "custom"  # Inherited common scientific setting; held fixed across the authored candidates.
  negative_surface_lambda: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  positive_existence_lambda: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  regional_positive_lambda: 0.3  # Inherited common scientific setting; held fixed across the authored candidates.
  regional_ranking_lambda: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  regional_loss_length: 2.5  # Inherited common scientific setting; held fixed across the authored candidates.
  regional_ranking_margin: 0.5  # Inherited common scientific setting; held fixed across the authored candidates.
  cardinality_lambda: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  total_variation_lambda: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  dirichlet_lambda: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  head_type: "single"  # Inherited common scientific setting; held fixed across the authored candidates.
  head_implementation: "controlled"  # Inherited common scientific setting; held fixed across the authored candidates.
  architecture_spike: "baseline"  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_geometry_transfer: false  # Inherited common scientific setting; held fixed across the authored candidates.
  interaction_round: "single"  # Inherited common scientific setting; held fixed across the authored candidates.
  vector_atomic_channels: 0  # Inherited common scientific setting; held fixed across the authored candidates.
  feedback_propagation: "none"  # Inherited common scientific setting; held fixed across the authored candidates.
  architecture_implementation: "controlled"  # Inherited common scientific setting; held fixed across the authored candidates.
  gate_cost_normalization: "baseline_count"  # Inherited common scientific setting; held fixed across the authored candidates.
  atomic_encoder_type: "schnet"  # Inherited common scientific setting; held fixed across the authored candidates.
  atomic_radial_encoding: "gaussian"  # Inherited common scientific setting; held fixed across the authored candidates.
  atomic_radial_count: 16  # Inherited common scientific setting; held fixed across the authored candidates.
  atomic_hidden_dim: 128  # V14a continuation: internal SchNet width 128; atom output and surface width remain 128.
  atomic_output_dim: 128  # Unchanged interface to atom-to-surface transfer.
  atomic_spatial_cutoff: 6  # Inherited common scientific setting; held fixed across the authored candidates.
  batch_size: 16  # Inherited common scientific setting; held fixed across the authored candidates.
  epochs: 500  # Maximum optimizer epochs, bounded by G-based patience.
  patience: 30  # Stop after this many non-improving protein-validation epochs.
  minimum_delta: 0.001  # Minimum improvement of protein-only checkpoint criterion.
  precision: "auto"  # Inherited common scientific setting; held fixed across the authored candidates.
  surface_metrics: true  # Numerical localization metrics only; no local-target gradients.
  surface_metrics_interval: 1  # Measure localization at each validation epoch; selection remains protein-only.
  visualization: {"mode":"none"}  # No duplicate per-seed viewer galleries during the training comparison.
  faithfulness_audit: false  # Inherited common scientific setting; held fixed across the authored candidates.
  evaluate_test: false  # Keep held-out test sealed.
  optimization_diagnostics: true  # Inherited common scientific setting; held fixed across the authored candidates.
  data_workers: 4  # Operational decoding parallelism; no effect on scientific content.

# TransferExperiment defaults: summary=mean, message=atom (atom|pair|point_pair|low_rank),
# rank=16 (>0), heads=1, shared_head_weights=false, channel_attention=false,
# normalization=softmax (softmax|entmax15), normalization_radius=null, learned_radius=false,
# radius_bounds=[1,12] Angstrom, radius_initial=6, radius_temperature=.5 Angstrom,
# epsilon=1e-8 (>0), summary_repeats=2, support=effective (effective|count),
# active_radius=null, active_k=null. candidates=base is consumed by Training, not the module.
# Selected message=low_rank changes values only; no new summary, heads, cutoff or radius gate.
# DiffusionSurfaceEncoder.configure defaults: readout_mode=single (single|concat|mixture|duplicate),
# readouts=1 (1..3), scale_multipliers=[.5,2] in TIME units, use_gradient=true,
# local_mode=none (none|distance|attention), local_sigma=2 Angstrom, local_area=false,
# local_initial_scale=0, local_chunk_size=65536, spectral_source=base (base|extension).
# Environment and residue options below remain separate scientific interventions.

# Constructor truth: Training dataset required; model_version=1, subset=full, hidden_dim=128,
# element width=32, residue width=null, atomic_layers=2, projection_depth=1, surface_layers=2,
# batch_size=2, epochs=100, patience=30, minimum_delta=.001, precision=auto, data_workers=4.
# atomic_representation=null by default; sources=(), identity_dim=8, external_model=null,
# external_mode=none|static|context|both|replace; context_dim=32; standard_deviation_floor=1e-6;
# context_control=aligned|mean|permuted (default aligned), context_seed=2026, drop_sources=().
# residue_graph=null by default; mode=hybrid (pointwise|null|sequence|contact|hybrid), hidden_dim=64,
# layers=2, radius=10 Angstrom, k=16, radial_count=16; output=context_dim; zero_initialize=true,
# initial_scale=1 (must not also be zero), topology=descending|roundtrip|parallel, atomic_dim=128,
# null_atomic_message=false, surface_radius=12 Angstrom, surface_k=32. CA support must be stored.
# surface_options=null; environment=null by default. Environment features=[travel_depth],
# mode=real|mask_only|curvature_control (default real), standard_deviation_floor=1e-6.
# All new normalization uses valid selected TRAIN only; checkpoint buffers preserve it exactly.
# New branch output initializes to zero, with nonzero multiplier, for exact baseline recovery.
# Added or ablated source widths are nominal unless explicitly removed; no hidden compaction.
# Remaining selected baseline choices below are deliberate inherited experiment overrides,
# not constructor defaults. Full public argument documentation is Training.run and lf explain.

seeds: [607,613,617,619]  # Predeclared paired complete replications; not favorable-seed selection.
# Explicit seeds are mandatory; no competitive pruning in finite sweeps.
sweep:  # Execute every authored candidate for every declared seed.
  space:  # Scientific alternatives only; native LF owns design expansion.
    atomic_representation:  # Exact public Training argument; mappings are whole constructor values.
      values:  # Four explicit choices; no source omission caused by nested-mapping replacement.
        - {"sources":["atom_name","residue_atom"],"identity_dim":8,"force_sources":"learned","external_model":"esm2","external_mode":"context","context_dim":64}  # Contemporary ESM-2 residue context only.
        - {"sources":["atom_name","residue_atom"],"identity_dim":8,"force_sources":"learned","external_model":"esm2","external_mode":"context","context_dim":64,"atomic_external_model":"slae","atomic_context_dim":32}  # ESM-2 plus aligned frozen atomic SLAE; retain chemical tables.
        - {"sources":["atom_name","residue_atom"],"identity_dim":8,"force_sources":"learned","atomic_external_model":"slae","atomic_context_dim":32}  # SLAE atom features without ESM-2; same explicit chemistry.
        - {"sources":["atom_name","residue_atom"],"identity_dim":8,"force_sources":"learned","external_model":"esm2","external_mode":"context","context_dim":64,"atomic_external_model":"slae","atomic_context_dim":32,"atomic_message_control":true}  # No additional atom-to-atom messages in WISDOM; SLAE itself remains contextual.
# sweep.space fields use values; omitted reference means no automatic scientific winner.
objective:  # Descriptive development utility; never local-GT epoch selection.
  metric: val_wisdom_hpo_score  # Retain G, both S forms, negative evidence and regret separately.
  mode: max  # Larger composite utility is better; not a substitute for paired interpretation.
  range: [0.0, 1.0]  # Mathematical utility bounds.
  practical_margin: 0.015  # Existing W margin, not an invented local-S significance threshold.
# Native objective requires metric; mode=max by default; bounds/margin are authored overrides.
resources:  # Shared study envelope; grant-aware LF admission owns concurrency.
  gpu: 2  # Never discover or broaden GPU tokens outside the provider grant.
  cpu: 36  # Total shared CPUs, not per-run worker reservations.
  memory: 96GiB  # Total host memory; not per-run VRAM.
  time: 168h  # Operational ceiling; recover interrupted mandatory Runs natively.
# Resources default cpu=1, gpu=0, processes=1, memory/storage/gpu_memory=0, time=null.
# SLAE preprocessing feasibility is REQUIRED, not evidence of a scientifically useful representation.
# ESM-AA remains excluded until public observed-atom token alignment can be verified; no fake alias.
# No execution packing or pruning overrides: native LF uses the actual granted resources.




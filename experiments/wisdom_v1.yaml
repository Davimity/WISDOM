# Measure the current pre-freeze WISDOM v1 baseline across ten seeds before changing its design.
name: wisdom-v1-baseline-seeds                       # First campaign stage: vary only the run seed.
run: wisdom.Training.Training                       # LambdaForge 0.14 train/validate/test Work class.

with:                                               # Fixed Training.run(...) arguments.
  dataset:                                          # Resolve one immutable managed placement.
    dataset: wisdom-dna-reduced@6                   # Schema-3 bounded topology/Diffusion release.
  model_version: 1                                  # Require bounded atomic topology and DiffusionNet.
  subset: full                                      # Use every train member already retained in this reduced release.
  pooling_type: max                                 # Required invariant for v1.
  hidden_dim: 128                                   # Freeze the current latent width for seed diagnosis.
  embedding_dim: 32                                 # Freeze the current element embedding width.
  residue_embedding_dim: 32                         # Freeze the current residue embedding width.
  atomic_layers: 2                                  # Freeze relation-aware atomic depth.
  projection_depth: 1                               # Freeze atom/surface projection depth.
  surface_layers: 2                                 # Freeze DiffusionNet depth.
  atom_spatial_k: 16                                # Freeze the bounded atom-neighbor budget.
  surface_atom_k: 16                                # Freeze nearest atom candidates per surface point.
  diffusion_spectral_modes: 128                     # Freeze the intrinsic spectral budget.
  surface_geometry_transfer: false                  # Keep the point-conditioned spike outside baseline.
  dropout: 0.2                                      # Freeze stochastic regularization.
  learning_rate: 0.0003                             # Freeze the AdamW learning rate.
  weight_decay: 0.0001                              # Freeze AdamW decoupled weight decay.
  gate_lambda: 0.001                                # Freeze normalized expected-L0 pressure.
  batch_size: 16                                    # Use available H100 memory to reduce optimizer steps.
  epochs: 500                                       # Safety ceiling; patience normally stops earlier.
  patience: 30                                      # Stop after thirty non-improving validation epochs.
  minimum_delta: 0.001                              # Require a 0.001 protein-score G improvement.
  precision: auto                                   # Use BF16 dense CUDA layers and FP32 sparse derivatives.
  surface_atom_radius: 6.0                          # Normalize transfer geometry by its stored Å cutoff.
  atomic_edge_distance_scale: 6.0                   # Map a 6 Å atom-edge distance to normalized value one.
  surface_chunk_size: 8192                          # Bound gathered atom activations to 8192 points.
  atomic_message_chunk_size: 65536                  # Record the bounded atomic edge-work budget.
  negative_surface_lambda: 0.0                      # Preserve L0: no weak local penalty in the baseline.
  surface_metrics: true                             # Diagnose local GT without affecting optimization.
  surface_metrics_interval: 1                       # Measure G/S/coupling on every validation epoch.
  surface_visualization: viewer                     # Write final HTML/PLY maps without duplicate prediction NPZ.
  surface_prediction_threshold: 0.5                 # Initial hard-map cutoff; each HTML can change it interactively.
  surface_visualization_maximum: 12                 # Render a balanced final gallery of 12 proteins.
  evaluate_test: false                              # Keep held-out test unopened throughout HPO.
  data_workers: 4                                   # Overlap NPZ decoding with each GPU training run.

# Fixed Training.run option reference:
# dataset has no default. model_version=1, subset="full", pooling_type="max", batch_size=2,
# epochs=100, patience=30, minimum_delta=0.001, precision="auto", surface_metrics=true,
# surface_metrics_interval=0, surface_visualization="viewer",
# surface_prediction_threshold=0.5,
# surface_visualization_maximum=12, evaluate_test=true, data_workers=4, and seed=0.
# LambdaForge supplies each seed below. This reduced DatasetVersion was built with only the
# "replicate-00/train-25" training population, so subset="full" selects that complete reduced
# population without applying a second view filter. Other DatasetVersions may expose "full" or
# names published in member metadata. Validation and test are never diluted. patience is positive;
# minimum_delta is non-negative; precision accepts "auto", "bfloat16", "float16", or "float32".
# surface_atom_radius=6.0 Å, atomic_edge_distance_scale=6.0 Å, surface_chunk_size=8192,
# surface_geometry_transfer=false, atomic_message_chunk_size=65536, gate_lambda=0.001, and
# negative_surface_lambda=0.0. The latter activates area-weighted weak supervision on globally
# negative bags when positive; it remains zero for the measurement baseline.
# Element identity is always active;
# every other generic atomic, graph, transfer, and curvature source is offered to the model and
# selected internally by semantic Hard-Concrete gates.
# V1 rejects any non-MAX pooling, non-DiffusionNet surface encoder, or structural dataset older
# than schema 3.0; it has no fallback to the retired surface-edge graph model. surface_metrics=false
# avoids metric-target decoding; enabled prediction HTML can still display its bounded GT sample.
# surface_metrics_interval=0 evaluates local metrics once on the
# restored best checkpoint; a positive N additionally evaluates them every N validation epochs.
# surface_visualization accepts "none", "viewer", or "full". Viewer writes HTML/PLY for a
# class-balanced sample bounded by surface_visualization_maximum; full additionally stores compact
# NPZ maps for every evaluated protein. The threshold lies in [0,1] and changes only the initial
# hard view, never metrics or optimization.
# auto uses BF16 dense layers on capable CUDA GPUs while keeping the
# unsupported sparse surface derivatives in FP32, and otherwise uses FP32 throughout.
# data_workers persists that many training loaders and uses half as many temporary evaluation
# loaders. With packed Runs, ensure the outer CPU request can support these subprocesses.

seeds: [4, 7, 32, 54, 65, 94, 109, 124, 142, 167]    # Ten independent baseline replications; no HPO pruning.

# V1 is not a fixed no-op: its experimental variable is the complete run seed. Architecture,
# optimizer, pooling, and loss are controls so the observed variance has a single interpretation.
# Seed-study option reference:
# seeds defaults to one framework-selected seed. This diagnostic deliberately supplies ten values
# and no search section: every seed must complete so mean, standard deviation, median, range, and
# collapse rate describe the current baseline rather than a probability-raced survivor population.

objective:                                           # Index the complete baseline purpose without searching it.
  metric: val_wisdom_hpo_score                      # W=0.35G+0.45S+0.20C, computed by Training.
  mode: max                                         # Larger frozen WISDOM utility is better.

resources:                                           # Per-seed training allocation.
  gpu: 3                                             # Run each independent baseline on one accelerator.
  cpu: 8                                             # Four loaders plus trainer/evaluation headroom.
  memory: 24GiB                                      # Host budget for decoded variable-size graphs.
  time: 168h                                         # Seven-day safety ceiling for one complete seed Run.

# LambdaForge 0.14 expands the ten seeds into independent Runs and records the declared objective;
# without search, it neither prunes candidates nor allocates confirmation seeds. gpu_memory is only
# required when search.runs_per_gpu packs multiple child Runs on one accelerator.
# Resource options are cpu>=1, gpu>=0, memory/gpu_memory/storage=<size>, time=<duration>, and
# processes<=cpu. Work/Attempt output paths are framework-owned; output_root is not configurable.

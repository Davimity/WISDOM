# Fixed and curriculum pooling families; review every imported Trial with an explicit seed.
# Post-hoc inspection does not fit models or replace paired-study decisions.
# Historical V5a best-model artifacts have no metadata.metrics: Pareto/median rankings are unsafe.
run: wisdom.visualization.StudyReview.StudyReview     # Native inference-only LF Work.

with:                                                # Arguments for reviewing registered evidence.
  source_execution: execution-c62242f59089c94f         # Exact ID from lf results list after native import.
  dataset: {dataset: wisdom-dna-reduced@6}             # Exact original dataset, locally placed.
  trial_selection:                                   # Historical evidence supports explicit, unranked review.
    mode: all                                        # Review all 206 completed pooling configurations.
  seed_selection:                                    # Fix replication without claiming it is best or median.
    mode: explicit                                   # No missing checkpoint metric is used to rank seeds.
    seeds: [4]                                       # Seed 4 exists in all 206 imported Trials.
  protein_selection:                                 # Views of contrasting cases; metrics cover all.
    mode: automatic                                  # Select diagnostic pictures after full inference.
    strategy: diagnostic                             # FP/FN, local extremes, negative peaks and mismatch.
    cases_per_category: 2                            # At most two cases per available category.
  maximum_proteins: 12                               # At most twelve diagnostic viewers per model/split.
  # This is 206 inference-only model evaluations, not 824 seed evaluations or any new training.
  # To reduce cost, replace trial_selection with mode: explicit and trial_indices: [<reviewed IDs>].
  # Alternative trial_selection (replace the active mapping, do not merge modes):
  #   mode: parameter_filter                       # Compare authored families without ranking.
  #   where:                                       # All conditions must hold; inactive != null.
  #     pooling_type: [max, log_sum_exp, attention] # Actual V5a families; may select many Trials.
  # Alternative where for exact fixed-LSE settings:
  #     pooling_type: log_sum_exp                   # Active LSE family.
  #     log_sum_exp_mode: fixed                     # Exclude curriculum, whose beta key is inactive.
  #     log_sum_exp_beta: [10.0, 20.0, 40.0, 80.0]  # Exact authored fixed beta values.
  # Pareto/median/representative require checkpoint-bound metadata.metrics, absent in this import.
  # Do not substitute latest Run metrics: they need not describe the restored best checkpoint.
  # For newer scored artifacts only, replace both policies with:
  # trial_selection: {mode: pareto, metrics: {global_score: max, surface_score: max}, maximum_trials: 8}
  # seed_selection: {mode: median, metric: wisdom_score}

# Work argument reference (actual defaults):
# source_execution: required registered ID; results_root=null uses LF's project ResultStore.
# dataset: required typed Path, identical to training; placements may differ, content may not.
# trial_selection=null: one Trial only; multiple Trials require an explicit policy.
# Trial modes: all; explicit/trial_indices=[]; parameter_filter/where={};
# best_by_metric or top_k_by_metric/metric="wisdom_score",direction="max",k=3;
# pareto/metrics={metric:max|min},maximum_trials=8. Ranked aggregation="median" or "mean".
# Every rank uses best-model metadata.metrics, never Run latest metrics. Conditional absent != null.
# seed_selection=null means median by wisdom_score, direction=max, k=3.
# Seed modes: all; explicit/seeds=[]; best/worst/median/top_k/bottom_k/representative.
# Historical artifacts without scored metadata require all/explicit Trial and seed selection.
# evaluation_scope="full" evaluates complete splits; "explicit" requires explicit protein IDs.
# protein_selection=null means automatic/diagnostic/cases_per_category=2.
# Protein modes: automatic (diagnostic/best/worst/mixed), explicit/identifiers=[], all (size warning).
# splits=["val"]; allow_test=false. Test is descriptive only, never used for model selection.
# content="predictions" or "full"; maximum_surface_points=2000 (>0), maximum_proteins=12 (>=0).
# prediction_threshold=0.5 in [0,1]; report_maximum_mib=14.0 in (0,16]; save_predictions=false.
# batch_size=4 (>0), data_workers=0 (>=0); strict_checkpoints=true fails on missing selected files.
# Numeric coverage is never sampled by viewer caps. Corrupt evidence always fails verification.

resources:                                           # Allocation for inference only, not training.
  cpu: 4                                             # Host decoding and CPU fallback.
  memory: 8GiB                                      # Bounded host-memory request.

# LF resource defaults: cpu=1, gpu=0; memory, gpu_memory, storage, time, processes are unset.
# cpu>=1, gpu>=0; memory/gpu_memory/storage accept sizes, time accepts durations;
# processes<=cpu. Add gpu: 1 explicitly for accelerator inference if useful.
# name defaults to the YAML stem; no seeds/search/sweep is needed for this frozen review.

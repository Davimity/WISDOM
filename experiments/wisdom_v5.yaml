# OBJECTIVE: LEGACY historical pooling sanity screen; V5a/V5b are now authoritative.
# PREREQUISITES: V4 must provide one reviewed core-HPO winner.
# VARIES: pooling family and only the hyperparameters belonging to that family.
# FIXED: core-HPO winner, initialization/optimizer winners, global BCE, architecture, and data.
# DECISION: historical evidence only; use V5a/V5b to nominate a family shortlist for V6.
run: wisdom.Training.Training                       # Shared Work; the filename supplies its study name.

# Research Analysis inherits Training.analysis_profile, including G/S/C/W and pooling questions.
# Optional analysis overrides use metrics/defaults/families/questions/discovery; {} retains the
# central class profile. Metadata never changes this legacy sweep, its seeds, or its objective.

with:                                               # Explicit carry-forward ledger.
  dataset: {dataset: wisdom-dna-reduced@6}          # Immutable reduced benchmark.
  model_version: 2                                  # Internal capability generation exposing poolings.
  subset: full                                      # Complete reduced training population.
  initialization_profile: baseline                  # REPLACE with the V2 winner.
  optimization_profile: baseline                    # REPLACE with the V3 winner.
  hidden_dim: 128                                   # REPLACE with the V4 winner.
  embedding_dim: 32                                 # REPLACE with the V4 winner.
  residue_embedding_dim: 64                          # REPLACE with the V4 winner.
  atomic_layers: 2                                  # REPLACE with the V4 winner.
  projection_depth: 3                               # REPLACE with the V4 winner.
  surface_layers: 4                                 # REPLACE with the V4 winner.
  atom_spatial_k: 8                                 # REPLACE with the V4 winner.
  surface_atom_k: 16                                # REPLACE with the V4 winner.
  diffusion_spectral_modes: 32                      # REPLACE with the V4 winner.
  surface_atom_radius: 4.0                          # REPLACE with the V4 winner.
  dropout: 0.2                                      # REPLACE with the V4 winner.
  learning_rate: 0.001                              # REPLACE with the V4 winner.
  weight_decay: 0.0005                              # REPLACE with the V4 winner.
  gate_lambda: 0.04                                 # REPLACE with the V4 winner.
  weak_loss_profile: baseline                       # Protein BCE only during pooling comparison.
  architecture_spike: baseline                      # No architecture change.
  head_type: single                                 # One faithful local-to-global head.
  batch_size: 16                                    # Proteins per optimizer update.
  epochs: 500                                       # Safety ceiling.
  patience: 30                                      # Global validation patience.
  minimum_delta: 0.001                              # Required score improvement.
  precision: auto                                   # Hardware-safe mixed precision.
  surface_metrics: true                             # Evaluation-only local metrics.
  surface_metrics_interval: 1                       # Required G/S/regret curves.
  visualization:                                    # Presentation only; generated once at this Run's best checkpoint.
    mode: none                                      # none disables all viewers; report embeds HTML without duplicate files.
    content: predictions                            # Probability, original logits and soft/hard GT only; full adds structural layers.
    maximum_points: 2000                            # Deterministic display-only sample; metrics retain every point.
    maximum_proteins: 4                             # Balanced proteins per evaluated split; zero displays all.
    report_budget_mib: 4.0                          # Maximum embedded document size, not evaluation coverage.
    # identifiers: [1ABC_A]                         # Optional exact evaluated IDs instead of automatic balanced sampling.

  # Visualization defaults: mode=none (none/report/viewer/full), content=predictions
  # (predictions/full), maximum_points=2000 (>0), maximum_proteins=12 (>=0),
  # report_budget_mib=4.0 in (0,16], identifiers=(), threshold=0.5 in [0,1],
  # embed_report=true. report writes embedded pages only; viewer adds HTML/PLY;
  # full additionally saves prediction NPZ. none overrides embed_report completely.
  # This is per completed Run, not per epoch or a post-Study best-seed callback.
  # LF has a 64 MiB combined report limit: keep mode=none for large sweeps/HPO.
  faithfulness_audit: true                          # Audit point deletion; unavailable for regional diffusion.
  evaluate_test: false                              # Keep test sealed.
  data_workers: 4                                   # Persistent NPZ workers.

sweep:                                              # Complete conditional pooling comparison.
  space:                                            # Enumerate every valid family-specific configuration.
    pooling_type:                                   # Protein aggregation family.
      values:                                       # Closed PoolingType vocabulary.
        - max                                       # One highest-scoring point determines the bag.
        - mean                                      # Average evidence over every surface point.
        - attention                                 # Learned weighting; may decouple localization.
        - topk                                      # Average only the highest-scoring surface fraction.
        - local_mean_max                            # Diffuse locally, then take the strongest region.
        - log_sum_exp                               # Smooth MAX with a tunable inverse temperature.
    topk_fraction:                                  # Active only for top-k pooling.
      values:                                       # Tested hotspot fractions.
        - 0.01                                      # Top one percent of the surface.
        - 0.05                                      # Top five percent of the surface.
        - 0.10                                      # Top ten percent of the surface.
      when: {pooling_type: topk}                    # Prevent irrelevant duplicate candidates.
    attention_hidden_dim:                           # Active only for learned attention.
      values:                                       # Keep attention capacity fixed in this sanity screen.
        - 32                                        # Compact scoring network.
      when: {pooling_type: attention}               # Ignore for every other pooling family.
    regional_diffusion_scale:                       # Active only for local-mean-max.
      values:                                       # Physical smoothing lengths in ångströms.
        - 1.5                                       # Compact local patch.
        - 2.5                                       # Intermediate local patch.
        - 5.0                                       # Broad coherent region.
      when: {pooling_type: local_mean_max}          # Ignore outside regional pooling.
    log_sum_exp_beta:                               # Active only for normalized LogSumExp.
      values:                                       # Inverse temperatures.
        - 1.0                                       # Mean-like smooth aggregation.
        - 5.0                                       # Intermediate baseline sharpness.
        - 10.0                                      # MAX-like sharp aggregation.
      when: {pooling_type: log_sum_exp}             # Ignore outside LogSumExp.
  reference: {pooling_type: max}                    # Compare all families against the current control.

objective:                                          # Select by WISDOM's complete validation purpose.
  metric: val_wisdom_hpo_score                      # Joint global/surface/coupling score.
  mode: max                                         # Maximize the composite validation utility.
  range: [0.0, 1.0]                                 # Mathematical bounds of the composite utility.
  practical_margin: 0.015                           # Smaller paired differences are negligible.

resources:                                          # Shared allocation for the complete study.
  gpu: 3                                            # Three available accelerators.
  cpu: 36                                           # Shared host decoding capacity.
  memory: 96GiB                                     # Shared host-memory ceiling.
  time: 168h                                        # Seven-day ceiling.

# Pooling hyperparameter defaults are topk_fraction=.05, attention_hidden_dim=32,
# regional_diffusion_scale=2.5 Å, and log_sum_exp_beta=5.0. `when` removes inactive dimensions.
# LambdaForge 0.15 makes all conditional cells mandatory, adds complete shared-replicate blocks,
# and applies no HPO pruning or per-cell seed racing. ARI chooses concurrency and memory admission.

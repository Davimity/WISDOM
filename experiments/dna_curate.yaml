name: wisdom-dna-curate                         # Stable LambdaForge Work name for public evidence curation.
run: wisdom.preprocessing.Selection.Selection  # Instantiate the only LambdaForge 0.12 Work in this script.

with:                                           # Keyword arguments passed directly to Selection.run(...).
  public_sources:                               # Fingerprint and stage the small pinned source manifest.
    file: ../data/dna/public-sources.json       # DyProL, BTD-Combo, and BioLiP release/checksum contract.
  workers: 128                                   # I/O threads; two per reserved CPU overlap network latency.
  requests_per_second: 60.0                      # Shared public-service request-start ceiling.

# Selection.run option reference:
# public_sources has no default and must be a LambdaForge {file: ...} marker.
# workers=72 and retries=5 are positive integers; workers controls bounded I/O concurrency.
# requests_per_second=4.0 is positive and limits aggregate request starts, independently of workers.
# max_positive_candidates=0 and max_negative_candidates=0 mean complete pinned releases; positive
# values provide bounded debugging runs and must never be published as the production benchmark.
# contact_distance=4.5 Å, minimum_residues=30, minimum_interface_residues=2,
# minimum_sequence_coverage=0.80, maximum_resolution=4.0 Å, and challenge_aspect_ratio=4.0 are the
# true constructor defaults and govern evidence/structure acceptance. This action never creates
# splits, phenotype clusters, geometry, model features, or a DatasetVersion.

resources:                                      # Portable scheduler reservation for this Work.
  cpu: 40                                       # Reserve 36 CPU cores; I/O threads may exceed this count.
  memory: 120GiB                                 # Host-memory ceiling for concurrent parsing and caches.
  time: 24h                                     # Maximum scheduler wall time.

# LambdaForge 0.12 resource fields are cpu>=1, gpu>=0, memory=<size>, time=<duration>, optional
# gpu_memory=<size>, storage=<size>, and processes<=cpu. Work/Attempt paths are framework-owned and
# therefore cannot be configured with the removed output_root field.

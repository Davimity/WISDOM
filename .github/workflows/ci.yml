name: Offline CPU checks  # Code contracts without constructing scientific datasets.
on: [push, pull_request]  # Check proposed and integrated changes.
# Events need no additional project configuration.
jobs:  # One supported CPU environment without cluster credentials.
  checks:  # Static checks and small deterministic fixtures.
    runs-on: ubuntu-latest  # Hosted Linux; no CUDA hardware.
    steps:  # Setup and verify the exact source tree.
      - uses: actions/checkout@v4  # Read the commit under test.
      - uses: actions/setup-python@v5  # Supported training Python.
        with: {python-version: "3.11"}  # Primary supported Python version.
      - run: python -m pip install --upgrade pip  # Current dependency metadata resolver.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu  # CPU PyTorch.
      - run: python -m pip install -e '.[dev]'  # Project and verification dependencies.
      - run: ruff check .  # Preserve manual scientific-code layout.
      - run: mypy src/wisdom  # Complete Python contracts.
      - run: pytest -q -m 'not network and not external_tools and not gpu and not slow and not browser'  # Offline fixtures.
        env: {CUDA_VISIBLE_DEVICES: "", MPLBACKEND: Agg}  # CPU and noninteractive plots.
# No secrets, remote jobs, production datasets or specialist downloads are used.
